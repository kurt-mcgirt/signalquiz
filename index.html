ed?", "On a moving train, or when any crew member is on the ground performing safety duties", ["Never if time allows", "Only at night", "Only on a main track when practical"], "2.21 A. Also when any crew member rides equipment during switching or anyone is preparing the train for movement."], ["w1x", "GCOR 2.21 · Rule", "An employee issued a railroad-supplied electronic device must do what?", "Log in at the start of duty and stay logged in until the tour of duty is complete", ["Log in only when needed", "Log out between jobs when practical", "Leave it at the terminal under normal conditions"], "2.21 B."], ["w1x", "TYE S-21.1 · Rule", "What clothing must employees in other than an office environment wear?", "Long pants and waist-length shirts with sleeves, and appropriate PPE", ["Shorts if hot", "Any clothing they prefer whenever conditions allow", "Sleeveless shirts in most situations"], "S-21.1 A."], ["w1x", "TYE S-21.1 · Rule", "Do finger rings get worn on the job?", "Not unless working in an office or office-like area", ["Yes, always under normal conditions", "Yes, if small in most situations", "Yes, if under 10 grams in most situations"], "S-21.1 A."], ["w1x", "TYE S-21.1 · Rule", "Hair must be secured if it could do what?", "Become entangled in machinery or obscure vision", ["Look untidy unless told otherwise", "Get dirty unless told otherwise", "Fall into the eyes at night only whenever conditions allow"], "S-21.1 A."], ["w1x", "TYE S-21.2 · Rule", "What must BNSF employees wear for safety eyewear?", "Safety glasses with permanently mounted side shields, authorized by BNSF", ["Any sunglasses when practical", "Glasses with removable shields", "Amber “shooter” lenses when practical"], "S-21.2 A."], ["w1x", "TYE S-21.2 · Rule", "Which tint is allowed for safety glasses outdoors?", "Grey #1, #2 and #3", ["Amber under normal conditions", "Any dark lens", "Rose in most situations"], "S-21.2 A: Grey #1 indoors, Grey #1, #2 and #3 outdoors. Amber lenses and lenses to correct color vision deficiency are prohibited."], ["w1x", "TYE S-21.2 · Rule", "When are safety glasses not required?", "When inside vehicles or equipment having enclosed cabs with windows completely closed", ["Inside any building if time allows", "At night under normal conditions", "On a locomotive with the door open"], "S-21.2 A exceptions."], ["w1x", "TYE S-21.4 · Rule", "When must hand protection be worn?", "When there is a risk of harmful substances, punctures, abrasions, cuts, burns, vibration, temperature extremes or infectious agents", ["Only in cold weather under normal conditions", "Only when told unless told otherwise", "Only in a yard if time allows"], "S-21.4 A."], ["w1x", "TYE S-21.4 · Rule", "When must gloves not be worn?", "Where they could be caught by moving parts or rotating stock", ["Around any tool if time allows", "When it is hot in most situations", "When you are tired unless told otherwise"], "S-21.4 B."], ["w1x", "TYE S-21.4 · Rule", "What must be done before each use of insulating gloves?", "Verify the integrity of the glove insulation", ["Wipe them off under normal conditions", "Wash them whenever conditions allow", "Nothing"], "S-21.4 C."], ["w1x", "TYE S-21.5 · Rule", "What color must enhanced visibility work wear be?", "Orange with retro-reflective striping", ["Yellow under normal conditions", "White under normal conditions", "Any bright color when practical"], "S-21.5 A: BNSF approved and meeting ANSI Class 2, ANSI Class 3, or CSA Z96 Class 2."], ["w1x", "TYE S-21.5 · Rule", "How must enhanced visibility garments be worn?", "As an outer garment, fastened closed at the front, sides and back", ["Under a coat unless told otherwise", "Open in front when practical", "Under overalls if time allows"], "S-21.5 A."], ["w1x", "TYE S-21.5 · Rule", "When is enhanced visibility work wear worn?", "When performing work outside of buildings and at locomotive service tracks", ["Only at night", "Only in a yard unless told otherwise", "Only on a main track under normal conditions"], "S-21.5 A."], ["w1x", "TYE S-21.6 · Rule", "Hearing protection is required when noise requires you to raise your voice at what distance during normal conversation?", "3 feet", ["1 foot", "10 feet", "20 feet"], "S-21.6."], ["w1x", "TYE S-21.6 · Rule", "Where must you wear hearing protection under S-21.6 A?", "Locomotive servicing tracks, fueling pads, inbound/outbound staging tracks and other posted areas", ["Only in a locomotive cab unless told otherwise", "Only in a yard office unless told otherwise", "Only on a main track in most situations"], "S-21.6 A."], ["w1x", "TYE S-21.6 · Rule", "Double hearing protection (plugs and muffs) is required within how far of active retarder operations?", "100 feet", ["25 feet", "50 feet", "200 feet"], "S-21.6 D. Also within 70 feet of pile driving activities, or on a locomotive under load testing."], ["w1x", "GCOR 6.27 · Rule", "When required to move at restricted speed, what must your speed allow?", "Stopping within half the range of vision short of train, engine, railroad car, men or equipment fouling the track, or stop signal", ["Stopping within the range of vision", "Stopping within 100 feet under normal conditions", "Stopping within one mile unless told otherwise"], "6.27. The restricted speed stop point is half the range of vision."], ["w1x", "GCOR 6.27 · Rule", "Besides half the range of vision, what else is required while moving at restricted speed?", "Keep a lookout for broken rail, and do not exceed 20 MPH", ["Sound the horn", "Reduce to 30 MPH unless told otherwise", "Ring the bell continuously if time allows"], "6.27."], ["w1x", "GCOR 6.27 · Rule", "Restricted speed also requires stopping short of what other condition?", "A derail or switch lined improperly", ["A tunnel under normal conditions", "A crossing if time allows", "A bridge"], "6.27."], ["w1x", "GCOR 6.27 · Rule", "How long must you comply with restricted speed requirements?", "Until the leading wheels reach a point where restricted speed is no longer required", ["Until the next signal in most situations", "Until the rear passes if time allows", "For 2 miles unless told otherwise"], "6.27."], ["w1x", "GCOR 6.27 · Scenario", "You are moving at restricted speed and see the rail ahead. What speed limit applies?", "Not exceeding 20 MPH, and stop within half the range of vision", ["25 MPH in most situations", "30 MPH under normal conditions", "Maximum authorized speed if time allows"], "6.27."], ["w1x", "GCOR 6.28 · Rule", "6.28 applies when moving on what?", "Other than a main track, or a track where a block system is not in effect", ["Any main track", "A controlled siding whenever conditions allow", "A block system track only when practical"], "6.28: except when moving on a main track or on a track where a block system is in effect, move at a speed allowing a stop within half the range of vision."], ["w1x", "GCOR 6.28 · Rule", "Under 6.28, what must you be able to stop short of?", "Train, engine, railroad car, men or equipment fouling the track, stop signal, or derail or switch lined improperly", ["Only a signal under normal conditions", "Only another train unless told otherwise", "Only a switch whenever conditions allow"], "6.28."], ["w1x", "GCOR 6.28 · Scenario", "You are shoving in a yard track not governed by a block system. What speed rule applies?", "A speed that allows stopping within half the range of vision", ["Maximum authorized speed if time allows", "10 MPH always if time allows", "Stop at every switch"], "6.28."], ["w1x", "GCOR 8.2 · Rule", "Who is responsible for the position of a switch or derail in use?", "The employee operating it", ["The dispatcher", "The conductor always under normal conditions", "The engineer in most situations"], "8.2."], ["w1x", "GCOR 8.2 · Rule", "You find a tagged switch. What do you do?", "Do not operate it", ["Operate it carefully", "Remove the tag", "Spike it open"], "8.2."], ["w1x", "GCOR 8.2 · Rule", "A switch is spiked. When may you remove the spike?", "Only if authorized by the same craft or group that placed it", ["Whenever needed whenever conditions allow", "If the dispatcher agrees unless told otherwise", "If it is a yard switch under normal conditions"], "8.2."], ["w1x", "GCOR 8.2 · Rule", "After locking a switch or derail, what must you do?", "Test the lock to make sure it is secured", ["Take the key if time allows", "Call the dispatcher", "Nothing unless told otherwise"], "8.2."], ["w1x", "GCOR 8.2 · Rule", "When may a switch be operated while equipment is fouling, standing on or moving over it?", "Only as permitted by rules governing spring switches", ["Never under normal conditions", "Only in a yard whenever conditions allow", "Whenever safe whenever conditions allow"], "8.2."], ["w1x", "GCOR 8.2 · Scenario", "You are about to line a hand-operated switch while the movement is on the adjacent track. What does 8.2 say?", "Movement must not foul the adjacent track until the hand-operated switch is properly lined", ["Line it while moving under normal conditions", "Foul the track first under normal conditions", "Ignore the adjacent track in most situations"], "8.2."], ["w1x", "GCOR 8.8 · Rule", "When not in use, switches equipped with locks, hooks, or latches must be what?", "Locked, hooked, or latched", ["Left open if time allows", "Left unlatched unless told otherwise", "Spiked in most situations"], "8.8."], ["w1x", "GCOR 8.8 · Rule", "For facing point train movements over a switch with a lock, what must you do?", "Lock the switch", ["Hook the switch", "Leave it unlatched", "Spike the switch"], "8.8."], ["w1x", "GCOR 8.8 · Scenario", "A switch lock is missing and cannot be replaced. What must you do?", "Report it at once to the dispatcher, yardmaster or supervisor in charge, and spike the switch if possible", ["Use the switch anyway in most situations", "Wait for the next crew under normal conditions", "Leave a note under normal conditions"], "8.8."], ["w1x", "GCOR 8.12 · Rule", "Both switches of a hand-operated crossover must be in what position before moving over?", "Corresponding position", ["Reverse position", "Normal for one and reverse for the other", "Any position"], "8.12."], ["w1x", "GCOR 8.12 · Rule", "When may crossover switches be out of corresponding position?", "One crew using both tracks during continuous switching, providing blue signal or inaccessible track protection, or performing maintenance in signaled territory", ["Whenever a crew is on the ground whenever conditions allow", "At night in most situations", "Never when practical"], "8.12."], ["w1x", "GCOR 8.12 · Rule", "After use, crossover switches connected to a main track or siding must be left how?", "Lined in normal position", ["Lined reverse whenever conditions allow", "Lined for the crossover whenever conditions allow", "Unlocked whenever conditions allow"], "8.12."], ["w1x", "GCOR 8.15 · Rule", "May you run through rigid switches?", "No, do not run through switches other than spring or variable switches", ["Yes, at 5 MPH whenever conditions allow", "Yes, at any speed when practical", "Yes, with the dispatcher’s permission whenever conditions allow"], "8.15."], ["w1x", "GCOR 8.15 · Rule", "A rigid switch has been run through. How must it be protected?", "By spiking the switch, unless a trackman or other employee takes charge", ["By flagging", "By setting out a car when practical", "By ignoring it under normal conditions"], "8.15."], ["w1x", "GCOR 8.15 · Rule", "An engine or car partially runs through a switch. What must it do?", "Continue movement over the switch, and not change direction over a damaged switch until it is spiked or repaired", ["Reverse immediately", "Stop on the switch if time allows", "Change direction over the switch in most situations"], "8.15."], ["w1x", "GCOR 8.16 · Rule", "Who is a damaged or defective switch reported to?", "The train dispatcher, yardmaster or supervisor in charge", ["The next crew only", "The roadmaster only unless told otherwise", "No one if time allows"], "8.16."], ["w1x", "GCOR 8.16 · Scenario", "You find a damaged switch and cannot make it safe. What next?", "Provide protection at once", ["Keep using it", "Wait for the next train unless told otherwise", "Leave without reporting under normal conditions"], "8.16: tag the switch and spike if necessary, unless a trackman or other employee takes charge."], ["w1x", "GCOR 8.20 · Rule", "What must employees in train, engine and yard service know about derails?", "The location of all fixed derails", ["Only the switches under normal conditions", "Only hand throw derails", "Nothing when practical"], "8.20."], ["w1x", "GCOR 8.20 · Rule", "A train approaching a fixed derail in derailing position must stop at least how far from it?", "100 feet", ["25 feet", "50 feet", "200 feet"], "8.20. Not applicable in engine servicing areas. Movement must not continue until the derail is in non-derailing position."], ["w1x", "GCOR 8.20 · Rule", "May you make a movement over a derail in derailing position?", "No", ["Yes, at 5 MPH", "Yes, with a flagman", "Yes, if empty"], "8.20."], ["w1x", "GCOR 8.20 · Scenario", "You are about to enter a track with a fixed derail in derailing position. What do you do?", "Stop at least 100 feet short and continue only after it is in non-derailing position", ["Stop at the derail whenever conditions allow", "Run over it slowly when practical", "Ask the dispatcher when practical"], "8.20."], ["w1x", "TYE S-1.1 · Rule", "When must a job safety briefing be held?", "At the beginning of the shift, before changing jobs, and as conditions change", ["Only at the beginning of the shift unless told otherwise", "Only after an injury", "Only for new jobs in most situations"], "S-1.1."], ["w1x", "TYE S-1.1 · Rule", "Who must be included in a job safety briefing?", "All individuals involved in the tasks or in the work area", ["Only the conductor whenever conditions allow", "Only supervisors when practical", "Only the engineer"], "S-1.1."], ["w1x", "TYE S-1.1 · enever conditions allow", "With your foot", "With a shovel only if time allows"], "S-13.7.1 A."], ["w1x", "TYE S-13.7.1 · Rule", "A switch is defective or hard to throw. What do you do?", "Remove it from service, label it with an out-of-service tag, and report location and problem to the dispatcher", ["Use it carefully in most situations", "Spike it open when practical", "Ignore it"], "S-13.7.1 B."], ["w1x", "TYE S-13.7.1 · Scenario", "You stop to line a switch and see ice packed around the points. What do you do?", "Remove it from between the switch point and stock rail with a broom or stick, not your hand or foot", ["Throw the switch hard when practical", "Kick it clear whenever conditions allow", "Skip the switch unless told otherwise"], "S-13.7.1 A."], ["w1x", "TYE S-25.2 · Rule", "What must you do if one person cannot manually handle a load safely?", "Use mechanical assistance, or request assistance", ["Lift in short bursts if time allows", "Lift with a belt under normal conditions", "Ask no one"], "S-25.2: do not use excessive force."], ["w1x", "TYE S-25.2.1 · Rule", "How often is a good rule of thumb to stretch?", "Every 20 to 30 minutes", ["Every 5 minutes under normal conditions", "Every 2 hours in most situations", "Only once per shift"], "S-25.2.1."], ["w1x", "TYE S-25.2.1 · Rule", "Which stretching practice is correct?", "Keep the stretch mild, breathe, and never feel pain", ["Bounce at the end", "Hold your breath under normal conditions", "Push through pain in most situations"], "S-25.2.1: use only BNSF-approved stretches."], ["w1x", "ABTH 102.1.5 · Rule", "Before switching begins in a yard, what must crews do?", "Secure equipment against undesired movement for equipment already in the track and equipment handled", ["Release all hand brakes unless told otherwise", "Cut out the brakes if time allows", "Nothing until switching ends under normal conditions"], "ABTH 102.1.5 step 1."], ["w1x", "ABTH 102.1.5 · Rule", "Before cars are kicked into a track, the TH 104.6 · Rule", "Where are retaining valves on freight cars?", "At the \"B\" end or at the side near the control valve", ["At the \"A\" end", "Under the car unless told otherwise", "On the roof when practical"], "ABTH 104.6."], ["w1x", "ABTH 104.6 · Rule", "What does the Direct Exhaust (EX) position do?", "Exhausts all brake cylinder pressure", ["Retains 20 psi in most situations", "Retains 10 psi in most situations", "Closes the exhaust unless told otherwise"], "ABTH 104.6."], ["w1x", "ABTH 104.6 · Rule", "What does the High Pressure (HP) position do?", "Exhausts brake cylinder pressure to 20 psi", ["Exhausts all pressure in most situations", "Exhausts to 10 psi in most situations", "Retains all pressure when practical"], "ABTH 104.6."], ["w1x", "ABTH 104.6 · Rule", "What does the Low Pressure (LP) position do?", "Exhausts brake cylinder pressure to 10 psi (four-position valve only)", ["Exhausts to 20 psi whenever conditions allow", "Exhausts all pressure", "Retains all pressure whenever conditions allow"], "ABTH 104.6."], ["w1x", "ABTH 104.6 · Rule", "How long is the blow-down time in the Slow Direct Exhaust (SD) position?", "About 86 seconds", ["About 10 seconds", "About 30 seconds", "About 5 minutes"], "ABTH 104.6."], ["w1x", "ABTH 104.6 · Rule", "What is the handle position for Direct Exhaust (EX)?", "Turned down", ["45° above horizontal", "Horizontal", "45° below horizontal"], "ABTH 104.6: HP is 45° below horizontal, SD is 45° above, LP is horizontal."], ["w1x", "GCOR 5.3.1 · Rule", "What does a hand signal swung at a right angle to the track mean?", "Stop", ["Proceed", "Back up", "Apply air brakes"], "5.3.1."], ["w1x", "GCOR 5.3.1 · Rule", "What does a hand signal raised and lowered vertically mean?", "Proceed", ["Stop", "Back up", "Release brakes"], "5.3.1."], ["w1x", "GCOR 5.3.1 · Rule", "What does a hand signal swung slowly in a circle mean?", "Back up", ["Proceed", "Stop", "Set brakes"], "5.3.1 (TYE S-13.1.2: back is swung in a circle at a right angle t  "GCOR 6.5 · Rule", "On a radio shove, what term means to move backward?", "\"Backup\"", ["\"Ahead\"", "\"Stop\"", "\"Reverse\""], "6.5: \"Ahead\" moves forward, \"Backup\" moves backward, \"Stop\" stops the movement."], ["w1x", "GCOR 7.1 · Rule", "When leaving equipment where a clearance point is not indicated or visible, how can you find it?", "Stand outside the rail of the adjacent track and extend your arm toward the equipment; if you cannot touch it, leave the equipment at least 50 feet further into the track", ["Guess the distance", "Leave it 10 feet from the switch unless told otherwise", "Leave it at the switch in most situations"], "7.1."], ["w1x", "GCOR 7.1 · Rule", "Where may equipment be left, fouling a siding switch, when the switch is lined for the main track?", "On a main track", ["In a siding", "On a yard lead", "On an industry track"], "7.1."], ["w1x", "GCOR 7.1 · Scenario", "You leave a cut of cars on an industry track. Where should they be?", "Beyond the clearance point of the switch leading to the industry", ["Fouling the switch in most situations", "Anywhere on the track if time allows", "At the switch point whenever conditions allow"], "7.1."], ["w1x", "GCOR 7.6 · Rule", "Can you depend on air brakes to hold equipment left unattended?", "No", ["Yes, if fully charged", "Yes, on level track", "Yes, for 1 hour"], "7.6. Engineer and conductor are jointly responsible, through a job briefing, for securing it with enough hand brakes. If not adequate, block the wheels."], ["w1x", "GCOR 7.6 · Rule", "When the engine is coupled to a train standing on a grade, when do you release the hand brakes?", "Not until the air brake system is fully charged", ["Before charging unless told otherwise", "After one minute under normal conditions", "When the dispatcher says"], "7.6."], ["w1x", "GCOR 7.6 · Rule", "When cars are moved from any track, what must you do?", "Secure enough cars with hand brakes to prevent the remaining cars from moving", ["Release all hand brakes when practical", "Apply the air brakes if time allows", "Nothing when practical"], "7.6."], ["w1x", "GCOR 7.7 · Rule", "When is kicking or dropping cars permitted?", "Only when it will not endanger employees, equipment, or contents of cars", ["Anywhere in most situations", "When under 5 MPH whenever conditions allow", "When no crew is nearby unless told otherwise"], "7.7."], ["w1x", "GCOR 7.7 · Rule", "Dropping cars is permitted only where?", "At locations specifically indicated by special instructions", ["Any yard unless told otherwise", "Any siding under normal conditions", "Any industry track unless told otherwise"], "7.7."], ["w1x", "GCOR 7.7 · Rule", "Cars must not be dropped over what?", "Spring switches or dual control switches", ["Hand switches when practical", "Crossings in most situations", "Any switch"], "7.7."], ["w1x", "GCOR 7.7 · Rule", "What is the maximum number of cars in a gravity switch move?", "Five", ["Two", "Ten", "Fifteen"], "7.7.1. Hand brakes must be manned to control and stop it, and cars must not couple to other equipment."], ["w1x", "TYE S-1.2.7 · Rule", "What does S-1.2.7 say about a task that can only be performed safely by two or more people?", "Do not perform it alone", ["You may perform it carefully", "Only do it at night", "Ask the dispatcher"], "S-1.2.7."], ["w1x", "TYE S-1.4.6 · Rule", "What does three-point contact consist of?", "Both feet and one hand, or both hands and one foot", ["Two feet and a leg under normal conditions", "One foot and one hand when practical", "Three fingers on a rail if time allows"], "S-1.4.6."], ["w1x", "TYE S-12.5 · Rule", "What must be worn in equipment or vehicles equipped with them?", "Seat belts", ["Hard hats when practical", "Gloves", "Vests in most situations"], "S-12.5. Lying down while wearing a seat belt is prohibited."], ["w1x", "TYE S-12.5 · Rule", "When are seat belts not required?", "When operating vehicles while performing train inspections or coupling air hoses (but required traveling ver conditions allow", "By \"A\" when practical", "By \"T\""], "SSI 41: axles 1 through 9 are numbers, then Z for 10, Y for 11, X for 12, and so on backward through the alphabet."], ["w1x", "SSI 41 · Scenario", "The defective journal is the ninth axle from the B end on the right side. How do you report it?", "R9", ["L9", "9R", "RZ"], "SSI 41."], ["w1x", "GCOR 1.3.2 · Rule", "Which statement about general orders is correct?", "They replace any rule, special instruction or regulation that conflicts with them", ["They are optional if time allows", "They are only for passenger trains", "They do not replace rules in most situations"], "1.3.2: numbered consecutively, issued and canceled by the designated manager, only about rules or operating practices."], ["w1x", "GCOR 1.3.2 · Rule", "When must crews review general orders that apply to their territory?", "Before beginning each day’s work or trip", ["At the end of the trip when practical", "Weekly", "Once per month if time allows"], "1.3.2."], ["w1x", "GCOR 1.3.3 · Rule", "Who issues and cancels circulars, instructions and notices?", "The designated manager", ["The dispatcher whenever conditions allow", "The conductor", "The engineer in most situations"], "1.3.3. Crew members must review those that apply before each day’s work or trip."], ["w1x", "GCOR 2.1 · Rule", "Before transmitting on the radio, what must you do?", "Listen long enough to make sure the channel is not being used", ["Key up immediately", "Ask the dispatcher unless told otherwise", "Test the radio unless told otherwise"], "2.1."], ["w1x", "GCOR 2.1 · Rule", "When may you continue with further transmission after identifying?", "After acknowledgment is received", ["Immediately if time allows", "After 5 seconds", "Never under normal conditions"], "2.1."], ["w1x", "GCOR 2.2 · Rule", "Mobile unit identification includes what, in order?", "Name or initials of the railroad, then train name (number), engine number, or words identifying the unit", ["Name, then location under normal conditions", "Engine number, then railroad", "Location only if time allows"], "2.2."], ["w1x", "GCOR 2.2 · Rule", "Base or wayside station identification includes what?", "Name or initials of the railroad, then name and location or other unique designation", ["Train number under normal conditions", "Engine number when practical", "The employee’s name whenever conditions allow"], "2.2."], ["w1x", "GCOR 2.2 · Rule", "When may a short identification be used?", "After a positive identification for switching, classification and similar operations within a yard, after the initial transmission and acknowledgment", ["Always under normal conditions", "Only on main track", "Only in emergencies whenever conditions allow"], "2.2."], ["w1x", "GCOR 2.3 · Rule", "An employee who receives a transmission must do what?", "Repeat it to the person transmitting", ["Say \"OK\"", "Acknowledge only unless told otherwise", "Write it down whenever conditions allow"], "2.3. Exceptions: yard switching communications, recorded automatic alarm messages, and general messages with no safety effect."], ["w1x", "GCOR 2.4 · Rule", "Which word ends a transmission when a response is expected?", "\"OVER\"", ["\"OUT\"", "\"CLEAR\"", "\"DONE\""], "2.4."], ["w1x", "GCOR 2.4 · Rule", "Which word ends a transmission when no response is expected?", "\"OUT,\" preceded by required identification", ["\"OVER\"", "\"CLEAR\" whenever conditions allow", "\"STOP\" unless told otherwise"], "2.4. Does not apply to yard switching operations."], ["w1x", "GCOR 2.6 · Rule", "You do not understand a radio communication. What must you do?", "Not act on it, and treat it as if it was not sent", ["Act on it anyway", "Guess the meaning when practical", "Continue the move if time allows"], "2.6."], ["w1x", "GCOR 2.6 · Rule", "What is the exception to 2.6?", "Information that may affect safety or cause property damage: take the safe course and stop movement if necessary until understood", ["Any message with a tr  a track bulletin be used to issue, change or cancel a general order, special instruction or rule?", "When authorized by the designated manager", ["Anytime", "By the conductor under normal conditions", "By the engineer whenever conditions allow"], "15.6."], ["w1x", "GCOR 15.6 · Rule", "Can a general order or special instruction canceled by a track bulletin be reinstated?", "No", ["Yes, after 24 hours", "Yes, by the dispatcher", "Yes, by radio"], "15.6."], ["w1x", "GCOR 15.6 · Rule", "How long must the track bulletin remain in effect?", "Until the general order that contains the change is posted", ["For 24 hours if time allows", "For 7 days whenever conditions allow", "Until the next train unless told otherwise"], "15.6."], ["w1x", "TYE S-13.8.1 · Rule", "What is the maximum supply of fusees you should store?", "No more than a 60-day supply", ["A 7-day supply whenever conditions allow", "A 30-day supply", "A 1-year supply unless told otherwise"], "S-13.8.1: store the minimum amount needed."], ["w1x", "TYE S-13.8.1 · Rule", "Where should fusees not be stored?", "Near high temperatures, open flames, combustibles, or where they may become wet", ["In a flagging kit whenever conditions allow", "In a locked compartment under normal conditions", "In original shipping containers"], "S-13.8.1."], ["w1x", "TYE S-13.8.2 · Rule", "What should you do with fusees that have been soaked in water or oil?", "Not use them, and dispose of them appropriately", ["Dry them in the sun", "Use them with care unless told otherwise", "Store them for later unless told otherwise"], "S-13.8.2."], ["w1x", "TYE S-13.8.4 · Rule", "What is the first step when lighting a fusee?", "Grasp the fusee near its base", ["Strike it right away whenever conditions allow", "Twist off the cap under normal conditions", "Hold the fusee by the tip under normal conditions"], "S-13.8.4."], ["w1x", "TYE S-13.8.4 · Rule", "When igniting a fusee, which way should your face turn?", "Away from the fusee, expecting hot spark ditions", "At the crossing unless told otherwise"], "5.8.2 (7) A."], ["w2d3x", "GCOR 5.8.2 · Rule", "At 45 MPH or less, when does signal (7) start?", "At least 15 seconds, but not more than 20 seconds, before entering the crossing", ["At least 5 seconds if time allows", "30 seconds when practical", "1 minute"], "5.8.2 (7) B."], ["w2d3x", "GCOR 5.8.2 · Rule", "How long do you prolong or repeat signal (7)?", "Until the engine completely occupies the crossing(s)", ["Until you pass the sign", "For 30 seconds under normal conditions", "Until the next signal under normal conditions"], "5.8.2 (7)."], ["w2d3x", "GCOR 5.8.2 · Rule", "What is whistle signal (8), long short, used for?", "Approaching men, equipment or other individuals on or near the track, regardless of whistle prohibitions", ["Crossing signal under normal conditions", "Backing up whenever conditions allow", "Brake test"], "5.8.2 (8). After the initial warning, sound (4) intermittently until the head end passes."], ["w2d3x", "GCOR 5.8.2 · Rule", "Whistle warning for men on the track is not required when?", "There is an adjacent track and the men are beyond the farthest rail of the adjacent track", ["They are wearing vests when practical", "It is daytime", "You are under 10 MPH whenever conditions allow"], "5.8.2 (8)."], ["w2d3x", "GCOR 5.8.2 · Scenario", "Your train approaches a public crossing at 50 MPH with the engine leading. When do you start the whistle?", "At or about the crossing sign, not more than 1/4 mile before the crossing", ["15 seconds before whenever conditions allow", "Half a mile before if time allows", "At the crossing whenever conditions allow"], "5.8.2 (7) A."], ["w2d3x", "GCOR 5.8.2 · Scenario", "You are stopped and the conductor gives a hand signal to back up. How do you acknowledge by whistle?", "Three short sounds", ["Two long sounds when practical", "One long sound whenever conditions allow", "Four short sounds when practical"], "5.8.2 (5)."], ["w2d3x", "GCOR 5.8.4 · Rule", "Within a designated whistle quiet zone, when is whistle signal (7) sounded approaching public crossings?", "Only for an emergency, malfunctioning or out-of-service warning devices, or when the quiet zone is not in effect", ["Never if time allows", "Always", "Only at night when practical"], "5.8.4."], ["w2d3x", "GCOR 5.8.4 · Rule", "Which of these lets you sound the horn in a quiet zone?", "An emergency situation, or warning devices that malfunction", ["Heavy traffic", "Bad weather when practical", "A late train under normal conditions"], "5.8.4: crews are also not restricted when a wayside horn system malfunctions or crossing warning systems are out of service."], ["w2d3x", "GCOR 5.8.4 · Rule", "What may an employee do in their sole judgment to prevent imminent injury, death or property damage?", "Sound the horn to warn other crews, vehicle operators, pedestrians, trespassers or animals", ["Nothing", "Stop the train whenever conditions allow", "Call the dispatcher first in most situations"], "5.8.4."], ["w2d3x", "GCOR 5.8.4 · Scenario", "You approach a crossing in a quiet zone and are notified the crossing devices are out of service. What now?", "Sound whistle signal (7)", ["Stay quiet under normal conditions", "Reduce to 10 MPH only in most situations", "Stop and wait in most situations"], "5.8.4: notified out-of-service devices allow signal (7)."], ["w2d3x", "GCOR 5.9 · Rule", "How must the headlight be displayed on the front of every train?", "On bright, unless dimmed per 5.9.1 or turned off per 5.9.2", ["Always dim unless told otherwise", "Off unless told otherwise", "Flashing whenever conditions allow"], "5.9."], ["w2d3x", "GCOR 5.9.1 · Rule", "Approaching public crossings at grade with the engine in front, where must the headlight be on bright?", "At the crossing sign", ["At the crossing when practical", "Half a mile before", "After the crossing"], "5.9.1."], ["w2d3x", "GCOR 5.9.1 · Rule", "At which location must the headlight be dimmed when switching is being done?", "
