It is within Restricted Limits"], "4.3: Y is Yard Limits."], ["r2", "GCOR 4.3 · Scenario", "The timetable shows C at a station. What does that tell you?", "Radio communication is shown for that location", ["It is a crossover between two main tracks", "It is a gate with its normal position against you", "Telephone communication is shown for that location"], "4.3: C is radio communication. P is telephone."], ["r3", "GCOR 5.4.1 · Rule", "What do yellow flags indicate?", "Temporary speed restrictions", ["That a train may be required to stop", "The end of a restricted area", "Permanent speed restrictions"], "5.4.1: yellow flags are used to indicate temporary speed restrictions."], ["r3", "GCOR 5.4.1 · Rule", "What do yellow-red flags indicate?", "That a train may be required to stop", ["Temporary speed restrictions", "The end of a restriction", "Movement at restricted speed only"], "5.4.1: yellow-red flags indicate when a train may be required to stop."], ["r3", "GCOR 5.4.1 · Rule", "What may restrict or stop train movements because of track conditions, structures, or men or equipment?", "Track bulletins, track warrants, or general orders", ["Only the permanent speed signs placed along the track", "Only the timetable and its special instructions", "Only the indications displayed by fixed signals"], "5.4.1."], ["r3", "GCOR 5.4.1 · Rule", "Flags are not displayed for a restriction. Where is that information included?", "In the track bulletin, track warrant, or general order", ["In the timetable special instructions for that subdivision", "On the signal aspect chart carried by the crew", "It is not provided anywhere in writing for the crew"], "5.4.1."], ["r3", "GCOR 5.4.1 · Rule", "A restriction spans adjoining subdivisions. How many sets of flags may be displayed in advance of the entire restriction in each direction?", "Only one set", ["One set on each subdivision", "Two sets", "As many sets as needed"], "5.4.1: separate temporary restrictions may be issued on each subdivision, but only one set of flags may be displayed in advance of the entire restriction in each direction."], ["r3", "GCOR Glossary · Rule", "What does the glossary say “Men or Equipment” means?", "Engineering Department employees and their related equipment", ["Any employees working on the ground", "Mechanical Department employees and their equipment", "Train crews and their locomotives"], "Glossary: Men or Equipment is a term referring to Engineering Department employees and their related equipment."], ["r3", "GCOR Glossary · Rule", "What is a Foreman?", "The employee in charge of work", ["The conductor of a work train", "The train dispatcher on duty", "The roadmaster"], "Glossary: Foreman is the employee in charge of work."], ["r3", "GCOR Glossary · Rule", "What is a track bulletin?", "A notice of conditions affecting train movement", ["A list of permanent speed restrictions", "A timetable supplement", "A record of crew assignments"], "Glossary: a notice of conditions affecting train movement. It may also authorize movement against the current of traffic where Rule 9.14 is in effect."], ["r3", "GCOR 5.4.2 · Rule", "How far ahead of the restricted area is a yellow flag displayed?", "2 miles", ["1 mile", "4 miles", "At the start of the restriction"], "5.4.2 A: employees must display a yellow flag 2 miles before the restricted area."], ["r3", "GCOR 5.4.2 · Rule", "When is a yellow flag displayed less than 2 miles ahead?", "When the area is close to a terminal, junction, or another area, or the restriction is on a siding", ["When the restriction is on a main track and the restricted speed is 30 MPH or less for all trains", "When the restriction is shorter than 10 miles and no bulletin is needed", "When the train is a passenger train that is already moving at reduced speed"], "5.4.2 A: that information is also included in the track bulletin, track warrant, or general order."], ["r3", "GCOR 5.4.2 · Rule", "What does a yellow flag warn trains to do?", "Restrict movement 4.2 B.2.c uses the rear of the train and needs dispatcher verification. Compare 5.4.3, which uses the leading wheels."], ["r3", "GCOR 5.4.2 · Rule", "Which of these does NOT allow a crew to resume speed after a yellow flag with no restriction in effect?", "The employee in charge of work gives permission", ["The crew receives a mandatory directive associated with the yellow flag", "The rear of the train passes a green flag", "The rear is 4 miles beyond the flag and the dispatcher verifies no restriction"], "5.4.2 B.2 lists only those three ways. Permission from an employee in charge of work is not one of them."], ["r3", "GCOR 5.4.5 · Rule", "What does a green flag indicate?", "The end of a temporary speed restriction", ["The start of a temporary speed restriction", "That a train may be required to stop", "That a train must proceed at restricted speed"], "5.4.5."], ["r3", "GCOR 5.4.5 · Rule", "A series of locations requires reduced speeds and green flags could overlap yellow flags. What must employees do?", "Place a yellow flag before each speed restriction and a green flag at the end of the last one", ["Place a green flag at the end of every restriction, with a yellow flag only before the first one", "Place one yellow flag at the start and a green flag after each restriction in the series", "Place only a yellow flag at the first restriction and no green flag until all the work is done"], "5.4.5."], ["r3", "GCOR 5.4.1 · Scenario", "A restriction runs across two subdivisions. How many sets of flags will you see in advance of it in your direction?", "One set, in advance of the entire restriction", ["One set on each subdivision, at the boundary", "Two sets, one for each direction of travel", "As many sets as the dispatcher decides are needed"], "5.4.1."], ["r3", "GCOR 5.4.1 · Scenario", "You see no flags, but your track bulletin lists a restriction. Does it apply?", "Yes, when flags are not displayed, the bulletin, warrant, or general order gives the restriction", ["No,  one hour before to one hour after the Form B is in effect", ["Only during the hours that the Form B is actually in effect", "Only during the one hour before the Form B first takes effect", "For up to 24 hours after the Form B has ended and is voided"], "5.4.3."], ["r4", "GCOR 5.4.3 · Rule", "During that time, what may the employee in charge give a train?", "Instructions to proceed without restriction, naming the bulletin number and advising no red flag displayed", ["Permission to ignore the yellow-red flag and proceed at track speed through the whole of the limits", "Instructions to proceed at track speed without naming the bulletin number that applies to the work", "Authority to pass a red flag at any speed once the train is inside the Form B limits"], "5.4.3."], ["r4", "GCOR 5.4.3 · Rule", "Does displaying yellow-red flags extend the working time on the Form B?", "No, it does not extend working time beyond the times on the Form B", ["Yes, it extends the working time by one hour after the Form B ends", "Yes, it extends the working time by two hours if the foreman asks", "Only if the foreman asks the train dispatcher to approve the extension"], "5.4.3."], ["r4", "GCOR 5.4.3 · Rule", "What does a yellow-red flag warn a train to do?", "Be prepared to stop because of men or equipment", ["Reduce speed because of track conditions or structures", "Resume track speed after the end of a restriction", "Pass the flag at restricted speed and keep moving"], "5.4.3 A."], ["r4", "GCOR 5.4.3 · Rule", "How far ahead of the restricted area is a yellow-red flag displayed?", "2 miles before the restricted area", ["1 mile before the restricted area", "4 miles before the restricted area", "At the restricted area"], "5.4.3 A: less than 2 miles when the area is close to a terminal, junction, or another area."], ["r4", "GCOR 5.4.3 · Rule", "A yellow-red flag is displayed and no restriction is in effect by bulletin, warrant, or general order. What must a crew member attempt to do?", "Contact the employee in charge of the yellow-red flag", ["Contact the train dispatcher for a track warrant", "Pass the flag and report it at the next station", "Ignore the flag and continue"], "5.4.3 B."], ["r4", "GCOR 5.4.3 · Rule", "In that case, where must crew members be prepared to stop?", "Short of a red flag 2 miles beyond the yellow-red flag", ["At the yellow-red flag itself, before moving beyond it", "Short of a red flag 1 mile beyond the yellow-red flag", "Short of a red flag 4 miles beyond the yellow-red flag"], "5.4.3 B."], ["r4", "GCOR 5.4.3 · Rule", "No red flag is displayed and the employee in charge has given no instructions. What speed applies?", "Restricted speed", ["10 MPH", "Track speed", "30 MPH"], "5.4.3 B.1. Compare 5.4.2 B, where the speed is 10 MPH."], ["r4", "GCOR 5.4.3 · Rule", "In that case, which of these allows the crew to increase speed?", "Leading wheels are 4 miles beyond the flag and the dispatcher verifies no bulletin or warrant protecting men or equipment applies", ["The rear of the train is 4 miles beyond the flag, and no verification from the train dispatcher is required at that point", "Leading wheels are 2 miles beyond the flag and the dispatcher verifies no bulletin or warrant protecting men or equipment applies", "The conductor reports to the engineer that no red flag has been displayed and no instructions have been received from anyone"], "5.4.3 B.2.b."], ["r4", "GCOR 5.4.7 · Rule", "What does a red flag mean?", "Trains must stop", ["Proceed at restricted speed", "Be prepared to stop", "A temporary speed restriction"], "5.4.7: a red flag is displayed where trains must stop."], ["r4", "GCOR 5.4.7 · Rule", "When approaching a red flag, what must the train do?", "Stop short of it and not proceed unless the employee in charge gives instructions", ["Stop at the flag and then proceed at restricted speed past the flag location", "Slow to 10 MPH and pass it once the crew has looked over the area ahead", "Stop only if a Form B is in effect, otherwise pass it at restricted speed"], "5.4.7."], ["r4", "GCOR 5.4.7 · Rule", "What must the employee in charge’s instructions to pass a red flag always include?", "The milepost location of the red flag", ["The train’s speed and length", "The dispatcher’s name", "The time the Form B was issued"], "5.4.7."], ["r4", "GCOR 5.4.7 · Rule", "What must a crew member give the employee in charge when trying to contact them?", "The location of the red flag and the track being used", ["The train symbol and the total tonnage of the train", "The names of the engineer and conductor on the train", "The time the train left its originating terminal"], "5.4.7."], ["r4", "GCOR 5.4.7 · Rule", "Instructions to proceed are received before the train stops. What may the train do?", "Pass the red flag without stopping", ["Stop and wait 5 minutes", "Stop and then proceed at restricted speed", "Stop and call the dispatcher"], "5.4.7."], ["r4", "GCOR 5.4.7 · Rule", "Track bulletin Form B is not in effect. What must instructions to pass a red flag include?", "Speed and distance", ["Time and date", "The milepost only", "An authority number"], "5.4.7."], ["r4", "GCOR 5.4.7 · Rule", "The employee in charge gives a speed and distance. Until when must that speed not be exceeded?", "Until the rear of the train has passed the specified distance from the red flag, unless the employee in charge says otherwise", ["Until the engine has passed the specified distance from the red flag, unless the dispatcher gives other instructions", "Until the next signal is reached by the engine, unless the employee in charge gives different instructions", "Until the conductor reports by radio that the entire train is clear of the area where the flag was placed"], "5.4.7."], ["r4", "GCOR 5.4.7 · Rule", "A red flag is displayed between the rails of a track. When may the train proceed?", "After the flag has been removed by an employee of the class that placed it", ["After the employee in charge gives the train instructions to proceed", "After stopping, at restricted speed through the flagged area", "After the train dispatcher gives the crew permission to proceed"], "5.4.7 Displayed Between Rails: the train must stop and not proceed until the flag is removed by an employee of the class that placed it."], ["r4", "GCOR 5.4.8 · Rule", "On which tracks are flags displayed?", "All Main Tracks and sidings leading to the track affected", ["Only the single track that is affected by the restriction", "Only Main Tracks, but not the sidings leading to the affected track", "Only sidings that lead directly to the track affected"], "5.4.8."], ["r4", "GCOR 5.4.8 · Rule", "Where are flags displayed relative to the track?", "To the right of the track as viewed from an approaching train", ["To the left of the track as viewed from an approaching train", "Between the rails", "On the engineer’s side of the train"], "5.4.8."], ["r4", "GCOR 5.4.8 · Rule", "In multiple Main Track territory, or where sidings are adjacent to Main Track(s), where are flags placed?", "On the field side of outside tracks", ["Between the tracks", "On the side nearest the affected track", "On the gage side of the nearest track"], "5.4.8."], ["r4", "GCOR 5.4.8 · Rule", "Which flags may be displayed between the rails?", "Red flags", ["Yellow flags", "Green flags", "Yellow-red flags"], "5.4.8: red flags may be displayed between the rails as outlined in Rule 5.4.7."], ["r4", "GCOR 5.4.8 · Rule", "Flags are displayed beyond the first rail of an adjacent track. Do they apply to the track your train is on?", "No, they do not apply to the track on which the train is moving", ["Yes, they apply to every track in the area where they are placed", "Only the yellow flags apply to the track the train is moving on", "Only the red flags apply to the track the train is moving on"], "5.4.8."], ["r4", "GCOR 5.4.8 · Rule", "On BNSF subdivisions where PTC or TWC Plus is in effect, what is not required for Form A speed restrictions?", "Displaying yellow and green track flags", ["Issuing the Form A to the train crews involved", "Displaying red flags at the limits of a Form B", "Reading and understanding the bulletin that applies"], "5.4.8 Supplemental Instruction. Exceptions are identified in the subdivision timetable under Item 4."], ["r4", "GCOR 5.4.3 · Scenario", "You pass a yellow-red flag and none of your bulletins show a restriction there. What do you do?", "Try to contact the employee in charge and be prepared to stop short of a red flag 2 miles beyond", ["Continue at track speed, since no restriction is listed in any of the crew’s bulletins", "Reduce to 10 MPH and hold that speed until the rear of the train is 2 miles beyond the flag", "Stop at the flag and call the train dispatcher before moving the train further"], "5.4.3 B."], ["r4", "GCOR 5.4.3 · Scenario", "Two miles past the yellow-red flag you reach a red flag. How do you proceed?", "As outlined in Rule 5.4.7, Display of Red Flag", ["At restricted speed past the flag, then at track speed", "At 10 MPH past the flag until the rear has cleared it", "After calling the dispatcher for permission to pass it"], "5.4.3 B refers you to 5.4.7."], ["r4", "GCOR 5.4.3 · Scenario", "You passed a yellow-red flag, saw no red flag, and have no instructions. Your leading wheels are 3 miles beyond it. What speed?", "Restricted speed", ["10 MPH", "Track speed", "Half of track speed"], "5.4.3 B.1: restricted speed until instructions are received or the leading wheels are 4 miles beyond with dispatcher verification."], ["r4", "GCOR 5.4.3 · Scenario", "Your leading wheels are 4 miles beyond the yellow-red flag and the dispatcher has verified that no bulletin or warrant protecting men or equipment is in effect. May you increase speed?", "Yes, you may increase speed", ["No, you need instructions from the employee in charge first", "No, the rear of the train must be 4 miles beyond", "No, restricted speed applies for 10 miles"], "5.4.3 B.2.b."], ["r4", "GCOR 5.4.3 · Scenario", "A foreman tells you: “Track Bulletin Form B No. 10887, no red flag displayed, proceed without restriction.” What does 5.4.3 say about this?", "It is allowed, the employee in charge may give such instructions around a Form B", ["It is not allowed, a train must always stop at a Form B before moving again", "It is a new track warrant that the crew must copy before they can move", "It cancels the Form B for the rest of the working day on that line"], "5.4.3: the employee in charge may give instructions to proceed without restriction, naming the bulletin number and advising no red flag displayed."], ["r4", "GCOR 5.4.7 · Scenario", "You approach a red flag and nobody has given instructions. What do you do?", "Stop short of the flag, try to contact the employee in charge, and wait for instructions", ["Pass the flag at restricted speed, watching closely for workers on or near the track", "Stop for 15 minutes, and if no one arrives, proceed at restricted speed past the flag", "Pass the flag at restricted speed and report the flag to the dispatcher afterward"], "5.4.7."], ["r4", "GCOR 5.4.7 · Scenario", "The employee in charge answers as you slow down and gives instructions including the red flag’s milepost. May you pass without stopping?", "Yes, if the instructions are received before the train stops", ["No, a complete stop is always required at any red flag", "Only at 5 MPH, and only after the crew has called the dispatcher", "Only if the train dispatcher agrees to the instructions first"], "5.4.7."], ["r4", "GCOR 5.4.7 · Scenario", "No Form B is in effect. The employee in charge lets you pass the red flag at 10 MPH for 2 miles. When may you go faster?", "When the rear of the train has passed 2 miles from the red flag, unless told otherwise", ["As soon as the engine has passed the red flag and the area is visibly clear", "When the engine is 2 miles past the red flag, unless the foreman says otherwise", "After the conductor reports by radio that the rear of the train is clear"], "5.4.7."], ["r4", "GCOR 5.4.7 · Scenario", "A red flag is between the rails and the foreman is gone. The dispatcher says to go ahead. What now?", "Stay stopped until the flag is removed by an employee of the class that placed it", ["Proceed on the dispatcher’s word, since the dispatcher controls the track", "Remove the flag yourself and proceed once you have looked over the area", "Proceed at restricted speed after notifying the dispatcher of the flag"], "5.4.7 Displayed Between Rails."], ["r4", "GCOR 5.4.8 · Scenario", "You are on double main track. Where do you look for flags?", "To the right, on the field side of the outside track", ["Between the two main tracks, in the middle of the track area", "On the left side of the track as viewed from your train", "Only between the rails of the track the work is on"], "5.4.8."], ["r4", "GCOR 5.4.8 · Scenario", "You are in PTC territory with a Form A restriction and you see no yellow flag. What do you do?", "Follow the Form A, since flags are not required for Form A restrictions where PTC or TWC Plus is in effect", ["Ignore the Form A for now, since no flag displayed means that no restriction applies at that location", "Apply the Form A to passenger trains only, since freight movements are governed by PTC alone in that area", "Wait for a green flag before following the Form A, since flags are always used in PTC territory"], "5.4.8 Supplemental Instruction."], ["r4", "GCOR 5.4.8 · Scenario", "A flag stands beyond the first rail of the adjacent track while you move on your own track. How does it affect you?", "It does not apply to the track on which your train is moving", ["Stop and contact the dispatcher before moving your train past it", "Treat it as applying to your track and reduce your speed", "Move past it at restricted speed until the rear clears it"], "5.4.8."], ["r5", "GCOR 5.5 · Rule", "What do the numbers on a permanent speed restriction sign show?", "The highest speed permitted over the limits of the restriction", ["The speed at which a train may resume after the restriction", "The distance in miles from the sign to the restriction", "The recommended speed for the next 2 miles of track"], "5.5."], ["r5", "GCOR 5.5 · Rule", "A sign shows two sets of numbers. Which governs trains consisting entirely of passenger equipment?", "The greater number", ["The lesser number", "The average of the two", "Whichever the engineer chooses"], "5.5."], ["r5", "GCOR 5.5 · Rule", "A sign shows two sets of numbers. Which governs all other trains?", "The lesser number", ["The greater number", "The average of the two", "The greater number for trains under 50 cars"], "5.5."], ["r5", "GCOR 5.5 · Rule", "What is placed at the end of each permanent restriction?", "A permanent resume speed sign or a speed sign showing a higher speed", ["A green flag, showing that the permanent restriction has ended", "A yellow-red flag, showing that the restriction has ended", "Nothing is placed, since the speed resumes at the timetable limit automatically"], "5.5."], ["r5", "GCOR 5.5 · Rule", "When may a train exceed the speed on a permanent speed sign again?", "When the rear has passed a resume speed sign or a higher-speed sign, or has cleared the limits", ["When the engine has passed a resume speed sign or a sign showing a higher speed, or cleared the limits", "When the engine has cleared the limits of the restriction, even if the rear has not", "After the train has traveled 2 miles beyond the sign that marked the start of the restriction"], "5.5."], ["r5", "GCOR 5.5 · Scenario", "Your freight train sees a sign reading 60/45. What is your maximum speed over the restriction?", "45 MPH", ["60 MPH", "50 MPH", "55 MPH"], "5.5: the lesser number governs all trains that are not entirely passenger equipment."], ["r5", "GCOR 5.5 · Scenario", "A train made up entirely of passenger equipment sees a 60/45 sign. What is the limit?", "60 MPH", ["45 MPH", "50 MPH", "55 MPH"], "5.5: the greater number governs trains consisting entirely of passenger equipment."], ["r5", "GCOR 5.5 · Scenario", "A passenger train with one freight car added meets a 60/45 sign. What governs?", "45 MPH, because the greater number is only for all-passenger trains", ["60 MPH, since most of the cars in the train are passenger cars", "55 MPH, which is the average of the two numbers shown on the sign", "60 MPH, if the conductor approves the higher speed"], "5.5."], ["r5", "GCOR 5.5 · Scenario", "Your engine passes the resume speed sign but the rear of the train is still in the restriction. May the train speed up?", "No, not until the rear has passed the resume sign or cleared the limits", ["Yes, the engine has passed the resume sign so the train may speed up", "Yes, but only after the engine is 1 mile beyond the resume sign", "Only if the train dispatcher approves the higher speed first"], "5.5."], ["r6", "GCOR 15.2 · Rule", "What does Rule 15.2 cover?", "Protection by Track Bulletin Form B", ["Authorizing movement against the current of traffic", "Protection when tracks are removed from service", "Copying track bulletins"], "15.2. Those other topics are 15.3, 15.4, and 15.7."], ["r6", "GCOR 15.2 · Rule", "Which flags are displayed to protect a Form B?", "Track flags as specified in Rules 5.4.3 (yellow-red) and 5.4.7 (red)", ["Yellow flags and green flags as specified in Rules 5.4.2 and 5.4.5", "Green flags only, displayed at the end of the Form B limits", "No flags are required, since the Form B itself gives the protection"], "15.2."], ["r6", "GCOR 15.2 · Rule", "Under 15.2, may a train enter the Form B limits?", "Not unless instructed by the employee in charge", ["Yes, at restricted speed if no workers are visible", "Yes, after the dispatcher is contacted by radio", "Yes, if the foreman has not displayed a red flag"], "15.2."], ["r6", "GCOR 15.2 · Rule", "A train is within the limits when the Form B takes effect. What must it do?", "Make no further movement until instructed by the employee in charge", ["Continue to the end of the limits before stopping the train", "Move at restricted speed until the train is clear of the limits", "Back out of the limits to the point where the train entered"], "15.2."], ["r6", "GCOR 15.2 · Rule", "A crew member must attempt to contact the employee in charge. What do they give, and when?", "The train’s location and track, when possible at least 2 miles before the limits", ["The train’s speed and length, when the train is within 1 mile of the limits", "The train’s tonnage and crew list, once the train is stopped at the limits", "The train’s symbol and engine number, after the train has entered the limits"], "15.2."], ["r6", "GCOR 15.2 · Rule", "How does the employee in charge identify themselves to a train?", "“Employee in charge of Track Bulletin No. __ between MP __ and MP __”", ["By train symbol and engine number, then the milepost where the flag is", "By gang number only, followed by the location of the work", "By the initials of the dispatcher who issued the Form B"], "15.2: specifying the line number and subdivision when necessary."], ["r6", "GCOR 15.2 A · Rule", "Which speeds may the employee in charge assign to a train going through Form B limits?", "Maximum Authorized Speed, Restricted Speed, or a speed the employee in charge specifies", ["Only Restricted Speed, or 10 MPH if the foreman prefers a slower speed", "Only the timetable speed, or Restricted Speed when the foreman asks for it", "Only Maximum Authorized Speed, or a speed the train dispatcher specifies by radio"], "15.2 A."], ["r6", "GCOR 15.2 A · Rule", "How may the employee in charge restrict a train through only part of the limits?", "By adding “Do not exceed __ MPH between/at MP __ and MP __”", ["By issuing a second Form B for the part of the limits", "By telling the train to stop at every milepost in the limits", "By reissuing the bulletin through the train dispatcher"], "15.2 A: two additional speeds may be given this way."], ["r6", "GCOR 15.2 A · Rule", "How does n from the employee in charge", ["Notify the train dispatcher of the intended entry", "Proceed at restricted speed into the Form B limits", "Display a yellow-red flag at the point of entry"], "15.2 D."], ["r6", "GCOR 15.2 C · Rule", "“STOP” is written in the Stop column of a Form B. What does that mean?", "The train must not enter the limits unless instructed by the employee in charge", ["The train must stop, then proceed at restricted speed through the limits", "Only trains carrying hazardous materials must stop before the limits", "The Form B has been canceled and trains may proceed at track speed"], "15.2 C. A red flag may be displayed at the beginning of the limits. The suggested Form B printed in your book has no Stop column, but 15.2 C is still in the rule."], ["r6", "GCOR 15.0 · Rule", "What does the suggested Track Bulletin Form A say?", "Between points shown, do not exceed the speed given (passenger and freight)", ["Be governed by Rule 15.2 within the limits listed on the form", "Movement against the current of traffic is authorized on the listed track", "The listed tracks are out of service and must not be used"], "Chapter 15 suggested forms. Form B says: on the date shown, be governed by Rule 15.2 within the following limits."], ["r6", "GCOR 15.0 · Rule", "What does the suggested Track Bulletin Form B say?", "On the date shown, be governed by Rule 15.2 within the following limits", ["Between the points shown, do not exceed the speed given for each train type", "Do not exceed 10 MPH within any of the limits shown on the form", "Track flags will not be displayed anywhere within the limits shown"], "Chapter 15 suggested forms."], ["r6", "GCOR 15.2 · Scenario", "You approach Form B limits with no instructions yet. What do you do?", "Try to contact the employee in charge, 2 miles ahead if possible, and wait for instructions to enter", ["Enter at restricted speed, watching closely for any workers or equipment inside the limits ahead", "Enter after notifying the  from the employee in charge", ["Notify the train dispatcher before you enter", "Proceed at restricted speed into the Form B limits", "Wait for a green flag at the crossover location"], "15.2 D."], ["r6", "GCOR 15.2 A · Scenario", "The foreman gives you restricted speed and adds “Men or equipment fouling Main 2.” What does that tell you?", "Workers or equipment are fouling Main 2, an adjacent track", ["Main 2 is out of service and must not be used by the train", "Main 2 has its own speed restriction posted by the foreman", "Main 2 is clear of workers and available for the train’s use"], "15.2 A."], ["r6", "GCOR 15.2 B · Scenario", "You want to reverse direction inside the Form B limits. What must happen?", "You need permission from the employee in charge", ["The conductor may authorize it after looking over the track", "The train dispatcher may authorize it by radio", "It is allowed at restricted speed if the track is clear"], "15.2 B."], ["r6", "GCOR 15.2, 5.4.3 · Scenario", "Two miles before a Form B you see a yellow-red flag. What does it tell you?", "Be prepared to stop for men or equipment and try to contact the employee in charge", ["A temporary speed restriction for track conditions, so no contact with anyone is needed", "The Form B has ended and the train may proceed at track speed", "You may proceed at track speed, since no red flag has been displayed yet"], "15.2 refers to 5.4.3. Yellow-red flags warn a train to be prepared to stop because of men or equipment."], ["a1", "ABTH 102.1 · Rule", "Can the air brake system be depended on to prevent undesired movement of standing equipment?", "No, crew members must secure it with hand brakes", ["Yes, if the brake pipe is fully charged in most situations", "Yes, if the train is on level track whenever conditions allow", "Yes, if retainers are set to hold in most situations"], "ABTH 102.1: the air brake system must not be depended upon to prevent undesired movement. Hand brakes secure standing equipment."], ["a1", "ABTH 102.1 · Rule", "Setting out cars on a grade with slack bunched, where do you apply hand brakes?", "On the low end of the cut of cars", ["On the high end of the cut of cars", "On the middle of the cut of cars", "On the rear car only"], "ABTH 102.1: slack bunched means the low end. Slack stretched means the high end."], ["a1", "ABTH 102.1 · Rule", "Setting out cars on a grade with slack stretched, where do you apply hand brakes?", "On the high end of the cut of cars", ["On the low end of the cut of cars", "On the middle of the cut of cars", "On the car nearest the engine"], "ABTH 102.1: slack stretched means the high end of the cut."], ["a1", "ABTH 102.1 · Rule", "Which of these does the number of hand brakes needed depend on?", "Grade and adhesion, loaded and empty cars, and weather", ["Train speed, crew size, and time of day in most situations", "Number of axles, car age, and track class in most situations", "Dispatcher preference and yard length under normal conditions"], "ABTH 102.1: grade and adhesion, number of loaded and empty cars, and weather conditions (wind and temperature)."], ["a1", "ABTH 102.1 · Rule", "To check that applied hand brakes will hold when not using the Car Secured Chart, what do you do?", "Release all air brakes", ["Make a full service reduction", "Cut out the control valves", "Apply the independent brake"], "ABTH 102.1: release all air brakes to verify the hand brakes prevent movement. All retainer valves must be in EXHAUST."], ["a1", "ABTH 102.1 · Rule", "What position must retainer valves be in when verifying hand brake securement?", "EXHAUST", ["HIGH PRESSURE", "SLOW DIRECT", "Any position"], "ABTH 102.1: all retainer valves must be in EXHAUST position."], ["a1", "ABTH 102.1.1 · Rule", "Securing a train with the lead locomotive consist attached, which locomotive hand brakes must be applied?", "All locomotive hand brakes on the lead consist", ["Only the lead unit’s hand brake in most situations", "None, the independent brake is enough", "Only the trailing unit’s hand brake whenever conditions allow"], "ABTH 102.1.1 step 1: apply required train hand brakes plus all locomotive hand brakes on the lead consist."], ["a1", "ABTH 102.1.1 · Rule", "When working out the minimum hand brakes for a train, how are locomotive hand brakes treated?", "They count toward the total", ["They never count toward the total", "They count only on the controlling unit", "They count double"], "ABTH 102.1.1: locomotive hand brakes should be counted toward the total."], ["a1", "ABTH 102.1.1 · Rule", "Are hand brakes required on conditioned distributed power remote consists when the train is otherwise properly secured?", "No, not required", ["Yes, on every remote unit", "Yes, on the first remote only", "Yes, but only on grades"], "ABTH 102.1.1: not required on conditioned DP remote consists per 102.3 when the train is otherwise properly secured."], ["a1", "ABTH 102.1.1 · Rule", "Locomotives are left in the trail position on a train. What must you not do with the brake pipe?", "Bottle air or keep air pressure in it", ["Open the angle cock if time allows", "Make a service reduction", "Set the retainers if time allows"], "ABTH 102.1.1 step 3: do not bottle air or maintain air pressure in the brake pipe when locomotives are left standing in trail."], ["a1", "ABTH 102.1.2 · Rule", "What must you not depend on when part of a train will be unattended?", "The air brake system", ["The hand brakes", "The locomotive", "The dispatcher"], "ABTH 102.1.2: do not depend on the air brake system to secure the cars."], ["a1", "ABTH 102.1.2 · Rule", "Before detaching locomotives from an unattended train, what brake pipe reduction must you make?", "A 20-psi reduction", ["A 10-psi reduction", "A 15-psi reduction", "A full service reduction"], "ABTH 102.1.2 step 3: make a 20-psi brake pipe reduction."], ["a1", "ABTH 102.1.2 · Rule", "Which angle cock do you close when detaching locomotives or cars from an unattended train?", "The one on the rear e lead locomotive consist", ["The one on the front car of the detached portion if time allows", "Both angle cocks at the break whenever conditions allow", "None, leave both open"], "ABTH 102.1.3 step 2: close it, then recharge if operating conditions permit."], ["a1", "ABTH 102.1.3 · Rule", "Why may extra hand brakes be needed on the low end before releasing air after a separation?", "To control slack or prevent undesired movement while recharging", ["To speed up the recharge", "To test the end-of-train device if time allows", "To clear the emergency application whenever conditions allow"], "ABTH 102.1.3 note."], ["a1", "ABTH 102.1.4 · Rule", "What is a single car securement test used for?", "A car left standing, not coupled to other equipment, to prevent uncontrolled movement", ["Any car in a train that is cut out when practical", "Cars with inoperative brakes only unless told otherwise", "Every car in a yard track unless told otherwise"], "ABTH 102.1.4."], ["a1", "ABTH 102.1.4 · Rule", "What is the maximum distance to move the car during the single car securement test?", "No more than 50 feet", ["No more than 10 feet", "No more than 100 feet", "No more than one car length"], "ABTH 102.1.4 step 3: move the car a minimal distance, no more than 50 feet, to be sure the hand brake works."], ["a1", "ABTH 102.1.4 · Rule", "A car has more than one hand brake. How many must be applied for the securement test?", "All of them", ["Only one", "Only the one on the A end", "Two at most"], "ABTH 102.1.4 step 1."], ["a1", "ABTH 102.1.4 · Rule", "Which of these is a place a single car may be left standing after the test?", "A customer’s facility or industry track", ["Permanently on a main track", "On a passing siding with no hand brake applied", "Any place the crew chooses"], "ABTH 102.1.4: customer facility or industry track, yard, siding or auxiliary track, temporarily on a main track during switching, or chained to the rail by Mechanical if the hand brake is inoperative."], ["a1", "ABTH 102.1.4 · Rule", "After the car is uncoupled in the test, what do you check?", "That no movement occurs with the car standing", ["That the air brakes apply", "That the angle cock is closed whenever conditions allow", "That the knuckle is open unless told otherwise"], "ABTH 102.1.4 step 4. If necessary, block the wheels or set out a second car."], ["a1", "ABTH 102.1.2 · Scenario", "You must leave the rear half of your train unattended and take the locomotives. Which order is right?", "Apply hand brakes, release air to test them, make a 20-psi reduction, close the angle cock on the last car detached, and let the rest go into emergency", ["Make a 20-psi reduction, close every angle cock, and leave the air brakes applied when practical", "Release air, take the engine, and rely on the air to hold unless told otherwise", "Apply hand brakes, then keep the brake pipe charged with yard air whenever conditions allow"], "ABTH 102.1.2: hand brakes, release air (or use the chart), 20-psi reduction, close the cock on the last car detached, let the brakes apply in emergency, and do not bottle air."], ["a1", "ABTH 102.1.2 · Scenario", "You cut off your engines and the rear portion stays. The brake pipe has not exhausted. A yard engine offers to hold air on it. Is that allowed?", "No, do not bottle air or keep pressure in the brake pipe when locomotives are detached or yard air is uncoupled", ["Yes, if the yard engine stays attached", "Yes, if the hand brakes are applied unless told otherwise", "Yes, if the end-of-train device is on under normal conditions"], "ABTH 102.1.2 step 6."], ["a1", "ABTH 102.1.3 · Scenario", "Your train goes into emergency and separates. The rear portion is on a grade. What do you do first?", "Secure the detached portion with the chart in 104.14", ["Release the brakes and recharge in most situations", "Walk to the head end and wait whenever conditions allow", "Call the dispatcher and wait for orders whenever conditions allow"], "ABTH 102.1.3 step 1."], ["a1", "ABTH 102.1.1 · Scenario", "You will leave a train with the lead locomotive attached. The brake pipe is charged. What must you do about the air brakes before leaving?", "Release all air brakes to confirm the hand brakes hold, unless you used the Car Secured Chart", ["Leave them applied since they help hold when practical", "Make a 20-psi reduction and leave the engine running when practical", "Nothing, the independent brake covers it whenever conditions allow"], "ABTH 102.1.1 step 2: release all air brakes to ensure hand brakes will prevent movement unless the Car Secured Chart was used."], ["a1", "ABTH 102.1.4 · Scenario", "You set out a car on a customer track. What do you do before leaving it?", "Perform the single car securement test", ["Set the retainer and leave", "Apply one hand brake only on a multi-brake car", "Rely on the air brake, since it has been charged"], "ABTH 102.1.4: a standing car not coupled to other equipment needs the single car securement test, with all hand brakes applied."], ["a1", "ABTH 102.1.4 · Scenario", "During a single car test the car creeps after uncoupling. What next?", "Block the wheels or set out a second car", ["Ignore it if it stops by itself", "Apply the air brakes and leave if time allows", "Report it after your shift if time allows"], "ABTH 102.1.4 step 5."], ["a1", "ABTH 102.1 · Scenario", "You are setting out cars on a grade and the slack is stretched. Where do you tie hand brakes?", "On the high end of the cut", ["On the low end of the cut", "Only on the last car", "Anywhere you can reach"], "ABTH 102.1."], ["a2", "ABTH 102.2 · Rule", "What must you do with hand brakes before moving cars or locomotives?", "Fully release all of them", ["Release only the ones on loaded cars", "Release half of them", "Leave them applied and watch the cars"], "ABTH 102.2: fully release all hand brakes to prevent wheel damage."], ["a2", "ABTH 102.2 · Rule", "When may hand brakes be left applied for a minimal distance?", "When spotting cars or performing a single car securement test", ["When running on a main track when practical", "When the train is under 25 cars whenever conditions allow", "When the dispatcher approves if time allows"], "ABTH 102.2 exception. A roll by inspection can be used to find cars with hand brakes that need releasing."], ["a2", "ABTH 102.2 · Rule", "How many additional cars must you check beyond the last applied hand brake?", "At least 3", ["At least 1", "At least 5", "At least 10"], "ABTH 102.2: check at least 3 additional cars to make sure no other hand brakes are applied."], ["a2", "ABTH 102.2 · Rule", "A hand brake is hard to release. What is the first step?", "Charge the air brake system and make a full service application, then try releasing the hand brake again", ["Hit the wheel with a hammer when practical", "Place the brake system in emergency right away", "Cut out the control valve unless told otherwise"], "ABTH 102.2."], ["a2", "ABTH 102.2 · Rule", "If it is still hard to release after a full service application, what next?", "Place the car or locomotive brake system into emergency", ["Move the car anyway", "Cut out the brakes under normal conditions", "Bad order the car and leave it in the train unless told otherwise"], "ABTH 102.2."], ["a2", "ABTH 102.2 · Rule", "A hand brake cannot be released. What movement is allowed?", "Only to set out the car", ["To the next terminal", "To the next siding only if under 10 MPH", "Any move under 20 MPH"], "ABTH 102.2."], ["a2", "ABTH 102.2 · Rule", "During that setout move, what is the speed limit if wheels are not turning freely?", "5 MPH", ["10 MPH", "15 MPH", "20 MPH"], "ABTH 102.2. The car must be watched the entire move."], ["a2", "ABTH 102.2 · Rule", "Who is the defect reported to when a hand brake cannot be released?", "The NOC Mechanical Help Desk and the dispatcher", ["The yardmaster only", "The next crew only when practical", "The trainmaster only in most situations"], "ABTH 102.2."], ["a2", "ABTH 102.5 · Rul f the limits."], ["s3", "SSI 33 · Rule", "Without a Wind/Train Speed Table, how fast may passenger trains go in 50-60 MPH winds?", "Up to 40 MPH", ["Up to 20 MPH", "Up to 60 MPH", "Up to 10 MPH"], "SSI 33: passenger trains without a table may go up to 40 MPH in 50-60 MPH winds and up to 20 MPH in 61-80 MPH winds."], ["s3", "SSI 33 · Rule", "Without a Wind/Train Speed Table, how fast may passenger trains go in 61-80 MPH winds?", "Up to 20 MPH", ["Up to 40 MPH", "Up to 10 MPH", "They must stop"], "SSI 33."], ["s3", "SSI 33 · Rule", "What must all trains do when a High Wind Warning exceeds 80 MPH?", "Stop", ["Proceed at 20 MPH", "Proceed at 40 MPH", "Proceed at restricted speed"], "SSI 33. Light engine consists or loaded bulk commodity trains may be authorized by the dispatcher to proceed at restricted speed."], ["s3", "SSI 33 · Rule", "A train must stop for a High Wind Warning. Who is notified immediately?", "The train dispatcher", ["The trainmaster", "The next train", "Nobody until released"], "SSI 33."], ["s3", "SSI 33 · Rule", "A train is cleared to proceed after stopping for high wind and the dispatcher directs it through. What is the maximum speed?", "20 MPH", ["10 MPH", "30 MPH", "40 MPH"], "SSI 33: proceed only if directed by the dispatcher; do not exceed 20 MPH."], ["s3", "SSI 33 · Rule", "What does a \"tornado warning\" mean?", "A tornado has been sighted or verified by the National Weather Service or by official weather spotters", ["A tornado is possible in the next 24 hours whenever conditions allow", "Thunderstorms are expected unless told otherwise", "A funnel cloud is forecast"], "SSI 33."], ["s3", "SSI 33 · Rule", "Under an active tornado warning, what must yard activities and locals actively switching within the limits do?", "Stop and seek shelter consistent with the safety of all involved", ["Continue switching at 5 MPH whenever conditions allow", "Switch only on main track whenever conditions allow", "Continue and report"], "SSI 33."], ["s3", "SSI 33 · Scenario", "Your train approaches a bridge and you see debris piled against it in fast-moving water. What do you do?", "Immediately stop and report to the dispatcher", ["Cross at 10 MPH when practical", "Cross at 20 MPH, prepared to stop under normal conditions", "Continue at 30 MPH under normal conditions"], "SSI 33: debris against a bridge with active water flow is a stop condition."], ["s3", "SSI 33 · Scenario", "The dispatcher advises a Flash Flood Warning for your area. What speed applies until your entire train has cleared the limits?", "Not more than 30 MPH", ["Not more than 20 MPH", "Not more than 40 MPH", "Restricted speed"], "SSI 33."], ["s3", "SSI 33 · Scenario", "Your passenger train is in a High Wind Warning with 70 MPH winds and no table on the work order. What speed?", "Up to 20 MPH", ["Up to 40 MPH", "Maximum authorized speed", "Stop"], "SSI 33."], ["s3", "SSI 33 · Scenario", "A High Wind Warning of 85 MPH is in effect and your freight train is loaded with coal. What applies?", "You must stop, unless the dispatcher authorizes restricted speed for loaded bulk commodity trains", ["Proceed at 40 MPH in most situations", "Proceed at 20 MPH", "No restriction unless told otherwise"], "SSI 33."], ["s4", "SSI 48 · Rule", "What is the purpose of the operations testing banners?", "To use as stop indications when testing compliance with stopping rules", ["To mark speed restrictions if time allows", "To mark work zones under normal conditions", "To show a signal failure"], "SSI 48."], ["s4", "SSI 48 · Rule", "What does Banner 1 look like?", "A high-visibility red/orange Stop banner, square or rectangular, about 18 by 18 inches", ["A yellow banner about 5 by 6 inches if time allows", "A white banner about 12 by 12 inches unless told otherwise", "A green banner about 18 by 18 inches if time allows"], "SSI 48."], ["s4", "SSI 48 · Rule", "Where is Banner 1 placed?", "Between the rails of the track", ["On the side of the track", "On the nearest signal if time allows", "On the locomotive under normal conditions"], "SSI 48."], ["s4", "SSI 48 · Rule", "On which tracks may Banner 1 be used?", "Any track: main, controlled siding, yard, industry and others", ["Main track only", "Yard tracks only under normal conditions", "Industry tracks only if time allows"], "SSI 48."], ["s4", "SSI 48 · Rule", "What must movements do when they see Banner 1?", "Stop short of the banner", ["Stop at the banner", "Reduce speed and continue", "Stop and flag ahead"], "SSI 48."], ["s4", "SSI 48 · Rule", "On which tracks may Banner 2 be used?", "Only yard or industry tracks governed by GCOR/MWOR 6.28", ["Any main track", "Controlled sidings only under normal conditions", "Any track in TWC territory when practical"], "SSI 48."], ["s4", "SSI 48 · Rule", "Where is Banner 2 placed?", "At an existing switch point or derail location, one on each rail directly across from one another", ["Between the rails at any location unless told otherwise", "On the switch stand unless told otherwise", "At the end of the siding in most situations"], "SSI 48."], ["s4", "SSI 48 · Rule", "What does Banner 2 look like?", "High-visibility red/orange with a horizontal yellow bar, about 5 by 6 inches", ["Solid red, about 18 by 18 inches in most situations", "Solid yellow, about 5 by 6 inches when practical", "White with a red bar, about 12 by 12 inches unless told otherwise"], "SSI 48."], ["s4", "SSI 48 · Rule", "Where must Banner 2 not be used?", "On switches equipped with switch point indicators, or on sidings in TWC territory to simulate a switch or derail lined improperly", ["On yard tracks under normal conditions", "On industry tracks in most situations", "At derail locations"], "SSI 48."], ["s4", "SSI 48 · Rule", "What distance applies for stopping short of Banner 1 on a main track or controlled siding under GCOR 6.22?", "400 feet short", ["100 feet short", "200 feet short", "At the banner"], "SSI 48: stopping 400 feet short of banners is applicable on a main track or controlled siding only."], ["s4", "SSI 48 · Scenario", "You are shoving cars in a yard track under 6.28 and see a red/orange banner with a yellow bar across both rails at a switch. What do you do?", "Stop short of the banners", ["Stop at the banners", "Continue at 5 MPH", "Continue if the switch is lined correctly"], "SSI 48 Banner 2."], ["s4", "SSI 48 · Scenario", "You are operating at restricted speed on a main track and see a red/orange banner between the rails. What do you do?", "Stop short of the banner", ["Pass it at 5 MPH", "Pass it if the track looks clear", "Call the dispatcher and continue"], "SSI 48 Banner 1: simulates a condition requiring movement to stop."], ["t1", "TYE S-1.6.2 · Rule", "Before fouling any track, what is your individual responsibility?", "Determine that it is safe to do so", ["Ask the engineer for permission", "Wait for a blue flag", "Notify the dispatcher first"], "S-1.6.2: employees have an individual responsibility to determine it is safe to foul any track."], ["t1", "TYE S-1.6.2 · Rule", "When may you expect movement on a track?", "At any time, on any track, in either direction", ["Only on the main track", "Only in the direction of traffic unless told otherwise", "Only when a signal is displayed under normal conditions"], "S-1.6.2 and S-1.6.1."], ["t1", "TYE S-1.6.2 · Rule", "If the track is occupied by rail equipment, what must you ensure before fouling it?", "That appropriate protection has been provided for the task", ["That the engine is shut down", "That the dispatcher has approved whenever conditions allow", "That the equipment has air applied under normal conditions"], "S-1.6.2."], ["t1", "TYE S-1.6.2 · Scenario", "You need to step onto a track where a cut of cars is standing and you can’t tell if it will move. What must you do?", "Make sure appropriate protection is in place for the task before fouling it", ["Foul it quickly since cars are standing unless told otherwise", "Foul it if no engine is attached in most situations", "Foul it if you hear no engine running"], "S-1.6.2."], ["t1", "TYE S-13.1.1 · Rule", "Which action does \"going between\" mean?", "Placing all or part of your body where it could be struck by rail equipment if it moved", ["Walking along a track in most situations", "Climbing onto an engine unless told otherwise", "Standing at a signal"], "S-13.1.1 definition. Operating the uncoupling lever is not considered going between."], ["t1", "TYE S-13.1.1 · Rule", "Is operating the uncoupling lever considered going between?", "No", ["Yes, always", "Yes, on locomotives only", "Yes, at night only"], "S-13.1.1 note."], ["t1", "TYE S-13.1.1 · Rule", "When must movement have stopped before you request going between?", "All movement must have stopped before you request it", ["Only the engine must have stopped under normal conditions", "Only the cars must have stopped whenever conditions allow", "It makes no difference"], "S-13.1.1: do not request going between until all movement has stopped."], ["t1", "TYE S-13.1.1 · Rule", "Between uncoupled equipment, what is the minimum clearance for going between, unless a rule permits otherwise?", "50 feet", ["25 feet", "10 feet", "100 feet"], "S-13.1.1: do not go between uncoupled locomotives or cars when clearance is less than 50 feet except when permitted by rule."], ["t1", "TYE S-13.1.1 · Rule", "When may you go between with less than 50 feet of separation?", "When a train on a main track or siding cannot move safely and you have exhausted all practical means of getting 50 feet", ["Whenever the engineer agrees", "Whenever the cars are coupled on one end unless told otherwise", "Whenever you are in a yard in most situations"], "S-13.1.1."], ["t1", "TYE S-13.1.1 · Rule", "Going between with less than 50 feet, how must you stay relative to the rail, when practical?", "At least one foot outside the rail", ["Between the rails under normal conditions", "On the rail in most situations", "Directly under the coupler whenever conditions allow"], "S-13.1.1."], ["t1", "TYE S-13.1.1 · Rule", "Two crews are switching in the same track from opposite ends. May a crew member request going between protection?", "No, not while multiple crews are actively switching in the same track", ["Yes, if the other crew agrees in most situations", "Yes, if it is a yard track unless told otherwise", "Yes, at any time by radio"], "S-13.1.1: only after all switching is complete and cars have stopped or made a coupling."], ["t1", "TYE S-13.1.1 · Rule", "The locomotive is coupled to the equipment. How do you announce going between?", "By radio, \"Going between,\" or by the prescribed hand signal", ["By one short whistle under normal conditions", "By waving a flag unless told otherwise", "By whispering to the engineer whenever conditions allow"], "S-13.1.1."], ["t1", "TYE S-13.1.1 · Rule", "What must the engineer do before acknowledging a coupled going between request?", "Fully apply the independent brakes and center the reverser", ["Release the independent brake unless told otherwise", "Remove the key only", "Apply the automatic brake only in most situations"], "S-13.1.1."], ["t1", "TYE S-13.1.1 · Rule", "What is the radio acknowledgement from the engineer when protection is set up?", "\"Set and centered\"", ["\"Brakes applied\"", "\"All clear\"", "\"Engine secured\""], "S-13.1.1. With hand signals, the engineer sounds one long whistle."], ["t1", "TYE S-13.1.1 · Rule", "What whistle signal acknowledges a hand signal for going between?", "One long whistle", ["Two short whistles", "One short whistle", "Two long whistles"], "S-13.1.1."], ["t1", "TYE S-13.1.1 · Rule", "What is the daytime hand signal for going between?", "Raise the arm farthest from the equipment straight above the head, and point the arm nearest the equipment at 90 degrees toward the equipment", ["Raise both arms above the head whenever conditions allow", "Swing the arm in a circle", "Hold the arm out horizontally if time allows"], "S-13.1.1."], ["t1", "TYE S-13.1.1 · Rule",  and centered\"", ["Walk between and tell the engineer afterward", "Ask the engineer to apply the automatic brake under normal conditions", "Go between if the engine is idling in most situations"], "S-13.1.1."], ["t1", "TYE S-13.1.1 · Scenario", "Another crew is working the other end of your track. You want to go between. What do you do?", "Do not request protection until all switching in the track is done and cars are verified stopped or coupled", ["Request protection by radio and go unless told otherwise", "Go between quickly between shoves if time allows", "Tell the other crew after you are in under normal conditions"], "S-13.1.1."], ["t1", "TYE S-13.1.1 · Scenario", "The engineer is another crew member who did not hear your \"Going between.\" What do you do?", "Do not go between until you receive the \"Set and centered\" acknowledgement", ["Go between since the radio was keyed", "Go between if the engine is idling when practical", "Go between if you see the engineer unless told otherwise"], "S-13.1.1."], ["t2", "TYE S-13.1.3 · Rule", "How close to the end of standing equipment may you cross a track, unless \"set and centered\" protection is in place?", "Not within 25 feet", ["Not within 10 feet", "Not within 50 feet", "Not within 5 feet"], "S-13.1.3 A."], ["t2", "TYE S-13.1.3 · Rule", "Within a designated mechanical facility, what track speed limit allows crossing within 25 feet of standing equipment not under blue flag protection?", "5 MPH or less", ["10 MPH or less", "15 MPH or less", "20 MPH or less"], "S-13.1.3 A: speed limits for all equipment on the track of 5 MPH or less, check for movement, safe distance, and walkways used."], ["t2", "TYE S-13.1.3 · Rule", "What should you do rather than step on rails, frogs, switches, interlocking apparatus or connections?", "Step over them", ["Step on them quickly", "Step on them only if dry", "Jump over them"], "S-13.1.3 B."], ["t2", "TYE S-13.1.3 · Rule", "When may you walk between the rails or foul the track?", "When duties require and safeguards are used", ["Whenever it is faster", "Whenever no train is visible unless told otherwise", "Whenever the engineer agrees whenever conditions allow"], "S-13.1.3 C."], ["t2", "TYE S-13.1.3 · Rule", "When must extra precaution be used when fouling track?", "During bad weather and when visibility is limited or impaired", ["Only at night", "Only on main track unless told otherwise", "Only in yards under normal conditions"], "S-13.1.3 C."], ["t2", "TYE S-13.1.3 · Scenario", "You need to cross a track 15 feet from the end of a standing cut of cars with no blue flag. What do you do?", "Cross farther away, at least 25 feet from the end, unless set and centered protection is in place", ["Cross there quickly", "Cross if the engine is idling unless told otherwise", "Cross if you hear no movement when practical"], "S-13.1.3 A."], ["t2", "TYE S-13.1.3 · Scenario", "You are crossing in front of an approaching engine. When is this allowed?", "Only if you are sufficiently ahead of the equipment to cross safely", ["Whenever the engine is slow in most situations", "Whenever the bell is ringing in most situations", "Whenever the crew sees you unless told otherwise"], "S-13.1.3 A."], ["t2", "TYE S-13.1.5 · Rule", "Should you ride equipment only when necessary?", "Yes, and only if you have determined you can do so safely", ["Yes, but safety does not need to be checked in most situations", "No, riding is always required in most situations", "Only if the engineer asks when practical"], "S-13.1.5."], ["t2", "TYE S-13.1.5 · Rule", "If walkway conditions permit, what rule applies to movements of 5 cars or less?", "Do not ride freight cars", ["Always ride the leading car", "Ride the trailing car only", "Ride the middle of the cut"], "S-13.1.5 A."], ["t2", "TYE S-13.1.5 · Rule", "Do you ride the exterior of the leading end of cars over crossings not equipped with gates?", "No, except within yards", ["Yes, always", "Yes, if you ring a bell", "Yes, at night only"], "S-13.1.5 A. Industry and customer facility tracks are not yards for this rule."], ["t2", "TYE S-13.1.5 · Rule", "Are industry and customer facility tracks considered yards in the application of this rule?", "No", ["Yes", "Only at night", "Only if they have gates"], "S-13.1.5 A note."], ["t2", "TYE S-13.1.5 · Rule", "At locations identified as close track centers, what is the rule on riding equipment?", "Do not ride or knowingly allow others to ride, except at the designated riding location on locomotives and shove platforms, or where no adjacent track exists", ["Ride only the field side whenever conditions allow", "Ride at any speed", "Ride only the trailing end whenever conditions allow"], "S-13.1.5 A."], ["t2", "TYE S-13.1.5 · Rule", "Before you ride equipment, who must you notify?", "The engineer, and proceed only after the engineer acknowledges", ["The conductor unless told otherwise", "The dispatcher under normal conditions", "The yardmaster when practical"], "S-13.1.5 B."], ["t2", "TYE S-13.1.5 · Rule", "How should you complete couplings when riding?", "From the ground after movement is stopped", ["While moving, from the car whenever conditions allow", "From the ladder while moving slowly", "From the coupler if time allows"], "S-13.1.5 B."], ["t2", "TYE S-13.1.5 · Rule", "If you need to move between freight cars while riding, what do you do?", "Dismount and walk to the next car", ["Step across the end platforms", "Climb over the couplers", "Cross through the coupler"], "S-13.1.5 B."], ["t2", "TYE S-13.1.5 · Rule", "Besides tank cars, can you ride the end platform or end ladder of a freight car?", "No", ["Yes, on any car", "Yes, on gondolas", "Yes, on flat cars"], "S-13.1.5 B: other than tank cars, do not ride the end platform or end ladder of any freight car."], ["t2", "TYE S-13.1.5 · Rule", "Two employees are riding equipment. How must they ride?", "Both on the same side", ["On opposite sides", "One inside the car", "One on the rear, one on the front, on op akes?", "By hand on the equipment, by hand from the ground, or with a brake stick from the ground", ["Only by hand on the equipment in most situations", "Only with a brake stick", "With a tool of your choice unless told otherwise"], "S-13.6."], ["t4", "TYE S-13.6 · Rule", "What is required for all hand brake methods?", "Going Between or Blue Signal Protection", ["Radio permission", "Engineer approval under normal conditions", "Dispatcher approval in most situations"], "S-13.6. Exceptions: using a brake stick with no part of the body in a position to be struck, or side-mounted hand brakes with no part of the body in a position to be struck."], ["t4", "TYE S-13.6.1 · Rule", "What are the three categories of hand brakes?", "Vertical wheel, lever (ratchet), and horizontal wheel (staff)", ["Vertical, side, and end in most situations", "Chain, wheel, and lever unless told otherwise", "Top, bottom, and middle"], "S-13.6.1."], ["t4", "TYE S-13.6.1 · Rule", "When operating hand brakes, what should you determine first?", "Location (end- or side-mounted), position (high or low, right or left), and method of operation", ["The car’s weight when practical", "The car’s owner", "The track grade unless told otherwise"], "S-13.6.1."], ["t4", "TYE S-13.6.2 · Rule", "When may you operate hand brakes on moving cars?", "Only in an emergency, or when making authorized gravity switch moves", ["Whenever speed is under 5 MPH", "Whenever you choose unless told otherwise", "When the engineer gives permission if time allows"], "S-13.6.2."], ["t4", "TYE S-13.6.3 · Rule", "Operating an end-mounted vertical wheel on the car with a brake step, which side of the brake do you stand on?", "The left side", ["The right side", "Directly in front", "Either side"], "S-13.6.3 A."], ["t4", "TYE S-13.6.3 · Rule", "Operating an end-mounted vertical wheel from the ground, where do your feet go?", "Both flat on the ground outside the rail", ["One on the rail whenever conditions allow", "Both between the rails when practical", "On the coupler"], "S-13.6.3 B."], ["t4", "TYE S-13.6.3 · Rule", "Operating an end-mounted vertical wheel from the ground, which hand grasps the ladder and which operates the brake?", "Left hand on the end ladder or hand hold, right hand on the brake", ["Right hand on the ladder, left hand on the brake if time allows", "Both hands on the brake", "Both hands on the ladder in most situations"], "S-13.6.3 B."], ["t4", "TYE S-13.6.3 · Rule", "Where do you stand to operate horizontal wheel (staff) brakes and inward-facing end-mounted brakes?", "On the car", ["On the ground", "On the rail", "On the adjacent track"], "S-13.6.3 D."], ["t4", "TYE S-13.6.3 · Rule", "When can you operate side-mounted hand brakes from the ground?", "If the mechanism is within easy reach and you can operate it safely without straining", ["Never when practical", "Only with a brake stick", "Only at night if time allows"], "S-13.6.3 C."], ["t4", "TYE S-13.6.3 · Rule", "How long can a brake stick be used from its date of manufacture?", "Five years", ["One year", "Three years", "Ten years"], "S-13.6.3 E."], ["t4", "TYE S-13.6.3 · Rule", "A brake stick is found defective. What must you do?", "Bring it back with an \"out of service\" tag and notify your supervisor; defective brake sticks cannot be repaired or altered", ["Repair it with tape whenever conditions allow", "Use it carefully", "Discard it on the track in most situations"], "S-13.6.3 E."], ["t4", "TYE S-13.6.3 · Rule", "When using a brake stick, where should you stand relative to the hand brake?", "On either side, not directly in front", ["Directly in front", "Underneath the wheel unless told otherwise", "On the coupler unless told otherwise"], "S-13.6.3 E."], ["t4", "TYE S-13.6.3 · Rule", "May a brake stick be used on a quick release brake lever?", "No, never operate a quick release brake lever with a brake stick", ["Yes, if careful if time allows", "Yes, on locomotives only", "Yes, if under 5 MPH under normal conditions"], "S t lowered in most situations", "Lift with one hand in most situations", "Use your foot when practical"], "S-13.6.8."], ["t4", "TYE S-13.6.8 · Rule", "On a horizontal wheel brake with a pawl, how is the pawl engaged?", "With your foot", ["With your hand", "With a hammer", "With a brake stick"], "S-13.6.8."], ["t4", "TYE S-13.6.8 · Rule", "Where should your thumbs be when you grasp the horizontal wheel rim?", "On the outside of the wheel", ["Inside the spokes in most situations", "Under the rim", "Behind the wheel under normal conditions"], "S-13.6.8."], ["t4", "TYE S-13.6.3 · Scenario", "You are applying an end-mounted vertical hand brake from the ground. Where do you stand?", "To the left of the brake, both feet flat outside the rail, left hand on the ladder, right hand on the brake", ["To the right of the brake, one foot on the rail when practical", "Directly in front, between the rails if time allows", "On the coupler, facing the wheel if time allows"], "S-13.6.3 B."], ["t4", "TYE S-13.6.2 · Scenario", "A car is rolling and you consider applying the hand brake as it passes. What does the rule say?", "Don’t operate hand brakes on moving cars except in an emergency or authorized gravity switch moves", ["Apply it carefully", "Apply it from the ladder under normal conditions", "Apply it if under 5 MPH whenever conditions allow"], "S-13.6.2."], ["t4", "TYE S-13.6.3 · Scenario", "You inspect a brake stick and see red showing in the handle. What do you do?", "Treat it as defective, tag it out of service, and notify your supervisor", ["Use it with care if time allows", "Tape over the red whenever conditions allow", "Use it once and report it unless told otherwise"], "S-13.6.3 E: any red or green in the handle means the stick is defective."], ["t4", "TYE S-13.6.3 · Scenario", "A brake stick is stamped with a manufacture date more than five years ago. What do you do?", "Remove it permanently from service and notify your supervisor", ["Keep using it whenever conditions allow", "Use it for angle cocks only", "Use it until it breaks unless told otherwise"], "S-13.6.3 E."], ["t4", "TYE S-13.6.7 · Scenario", "The lever stop on a lever brake housing is missing. What do you do?", "Do not operate the brake, since the lever could fly around when released", ["Operate it with a foot whenever conditions allow", "Operate it carefully under normal conditions", "Release it quickly"], "S-13.6.7."], ["t5", "TYE S-13.2.4 · Rule", "May you adjust the coupler or knuckle of a moving engine or car?", "No", ["Yes, at 2 MPH", "Yes, with a tool", "Yes, if on the ground"], "S-13.2.4."], ["t5", "TYE S-13.2.4 · Rule", "If you can’t align the drawbar with limited effort and an approved device, what do you do?", "Stop and contact mechanical personnel; if unavailable, bad order the equipment", ["Use more force", "Use a pry bar unless told otherwise", "Kick the knuckle unless told otherwise"], "S-13.2.4."], ["t5", "TYE S-13.2.4 · Rule", "Before adjusting a mismatched coupler, what separation must there be between couplers?", "At least 50 feet, with positive confirmation of protection from movement in all directions", ["At least 10 feet whenever conditions allow", "At least 25 feet under normal conditions", "At least 100 feet under normal conditions"], "S-13.2.4 step 5."], ["t5", "TYE S-13.2.4 · Rule", "What should you be alert to in tank cars before adjusting a coupler?", "Unexpected movement from liquids sloshing", ["Hot journals", "Leaking valves under normal conditions", "Defective couplers in most situations"], "S-13.2.4 step 2."], ["t5", "TYE S-13.2.4 · Rule", "May you adjust a coupler by kicking it?", "No", ["Yes, lightly", "Yes, with a heavy boot", "Yes, at night"], "S-13.2.4 A."], ["t5", "TYE S-13.2.4 · Rule", "Adjusting without a device, how do you stand?", "To the side of the knuckle, lower back against the knuckle/drawbar, feet shoulder width apart and one foot back", ["In front of the knuckle under normal conditions", "Behind the coupler", "On the rail if time allows"], "S-13.2.4 A."], ["t5", "TYE S-13.2.4 · Rule", "May you use your feet on or against the rail for leverage?", "No, never", ["Yes, with one foot", "Yes, if dry", "Yes, if wearing steel toe boots"], "S-13.2.4 A step 4."], ["t5", "TYE S-13.2.4 · Rule", "Using a coupler alignment strap, how close do you stop the movement to the standing car before attaching the second end?", "Within 3 feet", ["Within 10 feet", "Within 1 foot", "Within 25 feet"], "S-13.2.4 C."], ["t5", "TYE S-13.2.4 · Scenario", "You are using a Knuckle-Mate. Where do you place it?", "Over the top of the knuckle, with the pin securely in the hole at the top of the knuckle", ["Under the knuckle in most situations", "Beside the knuckle", "On the coupler horn if time allows"], "S-13.2.4 B."], ["t5", "TYE S-13.2.4 · Scenario", "The drawbar won’t align and mechanical isn’t around. What do you do?", "Bad order the equipment", ["Force it with your foot", "Tell the engineer to hit it", "Use a pry bar"], "S-13.2.4."], ["t5", "TYE S-13.2.4 · Scenario", "You hear equipment move while at the coupler. What do you do?", "Step clear immediately and communicate with the controlling engine", ["Keep adjusting when practical", "Wait to see in most situations", "Finish quickly under normal conditions"], "S-13.2.4 step 6."], ["t5", "TYE S-13.4.1 · Rule", "Before crossing through cars, what must you try to get?", "Confirmation the cars will not be moved", ["Permission from the dispatcher unless told otherwise", "A blue flag", "A hand signal under normal conditions"], "S-13.4.1."], ["t5", "TYE S-13.4.1 · Rule", "When all options for confirmation have been exhausted, what is permitted?", "Crossing through using a car with crossover platforms and continuous hand holds", ["Crossing under the cars", "Crossing over couplers unless told otherwise", "Crossing between cars unless told otherwise"], "S-13.4.1."], ["t5", "TYE S-13.4.1 · Rule", "While crossing through, what must you be prepared for?", "Sudden movement, and "s3", "SSI 33 · Rule", "Below the Low Temperature Threshold in non-signaled territory, what is the speed for all trains?", "40 MPH", ["30 MPH", "50 MPH", "65 MPH"], "SSI 33 Cold Weather Train Speeds."], ["s3", "SSI 33 · Rule", "Below the threshold in block signal limits, what is the speed for trains of 100 TOB and greater?", "40 MPH", ["50 MPH", "30 MPH", "65 MPH"], "SSI 33: 100 TOB and greater is 40 MPH. Key trains and trains under 100 TOB are 50 MPH. Passenger, Z-symbol intermodal and single level loaded intermodal trains are 65 MPH."], ["s3", "SSI 33 · Rule", "Below the threshold in block signal limits, what is the speed for passenger trains?", "65 MPH", ["40 MPH", "50 MPH", "55 MPH"], "SSI 33 Cold Weather Train Speeds."], ["s3", "SSI 33 · Rule", "In Region 1, what is a Temperature Change Warning?", "Any temperature of 50°F or warmer that falls to 10°F or colder within 24 hours", ["A drop of 20 degrees in one hour", "Any temperature below 0°F", "A drop from 40°F to 0°F within 24 hours"], "SSI 33. In Region 2 it is 40°F or warmer falling to 0°F or colder within 24 hours."], ["s3", "SSI 33 · Rule", "In Region 2, what is a Temperature Change Warning?", "Any temperature of 40°F or warmer that falls to 0°F or colder within 24 hours", ["Any temperature of 50°F or warmer that falls to 10°F or colder within 24 hours", "Any temperature below -20°F", "A drop of 20 degrees within one hour"], "SSI 33."], ["s3", "SSI 33 · Rule", "You are unsure of the ambient temperature. What do you do?", "Get a reading from local means such as field personnel or detectors, or contact the train dispatcher", ["Assume it is above the threshold", "Estimate it yourself and continue", "Wait until it warms up"], "SSI 33: if in doubt, contact the dispatcher. Also notify the dispatcher when your train is restricted."], ["s3", "SSI 33 · Rule", "How long do cold weather train speed restrictions stay in effect?", "Until the ambient temperature rises above the Low Temperature Threshold", ["Until the end of your tour of duty", "For 24 hours", "Until the next terminal"], "SSI 33."], ["s3", "SSI 33 · Rule", "An earthquake is reported and the magnitude or epicenter is unknown. What instruction does the dispatcher give trains within 150 miles of the reporting location?", "Proceed at Restricted Speed due to earthquake conditions", ["Stop and wait", "Proceed at 30 MPH", "Proceed at maximum authorized speed"], "SSI 33: an acknowledgment must be obtained from each train or engine."], ["s3", "SSI 33 · Rule", "For an earthquake with a magnitude less than 5.0, what is required?", "No inspection", ["Inspect signals", "Inspect signals and track", "Inspect signals, track and bridges"], "SSI 33."], ["s3", "SSI 33 · Rule", "For an earthquake of magnitude 5.0 to 5.49, how do trains proceed?", "At Restricted Speed until signals have been inspected", ["At Restricted Speed until signals, track and bridges have been inspected", "At maximum authorized speed", "At 30 MPH until signals have been inspected"], "SSI 33."], ["s3", "SSI 33 · Rule", "For an earthquake of magnitude 5.5 to 5.99, how do trains proceed?", "At Restricted Speed until signals, track and bridges have been inspected", ["At Restricted Speed until signals have been inspected", "At maximum authorized speed", "At 40 MPH until bridges have been inspected"], "SSI 33."], ["s3", "SSI 33 · Rule", "A train stops within tornado warning limits. Before proceeding, what must the crew determine?", "Whether the tornado’s path crossed the tracks ahead or near the train", ["Whether the dispatcher has gone off duty", "Whether the wind has stopped", "Whether the next train is behind"], "SSI 33. If confirmed, the crew must inspect the train for damage or derailment and the track structure for damage."], ["s3", "SSI 33 · Rule", "Which rule governs a train proceeding through tornado warning limits?", "GCOR 6.21.3", ["GCOR 6.27", "GCOR 6.22", "GCOR 6.28"], "SSI 33."], ["s3", "SSI 33 · Rule", "How long does the dispatcher keep issuing the tornado warning?", "Until a designated division employee inspects, or a train traverses the limits and the crew confirms no damage or unexpected conditions", ["Until the warning expires on the weather service", "For 24 hours", "Until the next train asks"], "SSI 33."], ["s3", "SSI 33 · Scenario", "The temperature is -5°F in Region 1 in non-signaled territory. What is your maximum speed?", "40 MPH", ["30 MPH", "50 MPH", "65 MPH"], "SSI 33: -5°F is below Region 1’s 0°F threshold, so non-signaled speed is 40 MPH for all trains."], ["s3", "SSI 33 · Scenario", "It is -5°F in Region 2 in block signal territory, with a 120 TOB freight train. Do cold weather train speeds apply?", "No, -5°F is above Region 2’s -20°F threshold", ["Yes, 40 MPH", "Yes, 50 MPH", "Yes, 65 MPH"], "SSI 33: Region 2 threshold is -20°F. Check for a Temperature Change Warning too."], ["w1x", "GCOR 1.1 · Rule", "What does GCOR 1.1 call the most important element in performing duties?", "Safety", ["Efficiency", "On-time performance", "Customer service"], "1.1: safety is the most important element. Obeying the rules is essential to job safety and continued employment."], ["w1x", "GCOR 1.1 · Rule", "According to 1.1, what is essential to job safety and continued employment?", "Obeying the rules", ["Finishing work early", "Keeping up with the crew", "Following the supervisor only"], "1.1."], ["w1x", "GCOR 1.1.1 · Rule", "In case of doubt or uncertainty, what must you do?", "Take the safe course", ["Continue and ask later", "Take the fastest course", "Follow the most senior employee"], "1.1.1."], ["w1x", "GCOR 1.1.1 · Scenario", "You are unsure whether a route is clear for a shove. What does 1.1.1 require?", "Take the safe course, which means stopping until you are sure", ["Shove slowly and watch in most situations", "Assume it is clear whenever conditions allow", "Let the engineer decide in most situations"], "1.1.1: in doubt, take the safe course."], ["w1x", "GCOR 1.1.2 · Rule", "What must employees be when performing their duties?", "Alert and attentive", ["Fast and efficient", "Quiet and focused on paperwork", "Ready to take shortcuts"], "1.1.2: also careful to prevent injuring themselves or others, and plan work to avoid injury."], ["w1x", "GCOR 1.1.2 · Rule", "What should you do when planning your work under 1.1.2?", "Plan it to avoid injury", ["Plan it to save time", "Plan it to match the last crew", "Do not plan, just react"], "1.1.2."], ["w1x", "GCOR 1.1.3 · Rule", "How must accidents, personal injuries, and defects in tracks, bridges or signals be reported?", "By the first means of communication", ["At the end of the tour of duty in most situations", "At the next terminal in most situations", "Only in writing under normal conditions"], "1.1.3: also report any unusual condition affecting safe operation. Where required, furnish a written report promptly afterward."], ["w1x", "GCOR 1.1.3 · Scenario", "You notice a defect in a bridge while crossing. When do you report it?", "By the first means of communication", ["At the end of your trip in most situations", "After your rest", "When asked by a supervisor whenever conditions allow"], "1.1.3."], ["w1x", "GCOR 1.1.4 · Rule", "What must employees do with equipment and tools they use?", "Check their condition", ["Assume they are safe", "Replace them every week", "Leave checks to supervisors"], "1.1.4."], ["w1x", "GCOR 1.1.4 · Scenario", "Your lantern is defective. What do you do?", "Do not use it until it is safe to use, and report the defect to the proper authority", ["Use it until the trip ends if time allows", "Use it only at night", "Tape it up and continue if time allows"], "1.1.4."], ["w1x", "GCOR 1.2.5 · Rule", "How soon must a personal injury on duty or on company property be reported?", "Immediately, to the proper manager, with the prescribed form completed", ["By the end of the week in most situations", "Only if medical care is needed under normal conditions", "At the next crew change"], "1.2.5."], ["w1x", "GCOR ger crews only whenever conditions allow"], "1.11.1."], ["w1x", "GCOR 1.11.1 · Rule", "What is the maximum length of a nap, including the time needed to fall asleep?", "45 minutes", ["15 minutes", "30 minutes", "60 minutes"], "1.11.1."], ["w1x", "GCOR 1.11.1 · Rule", "At least how many crew members must stay awake while another naps?", "One", ["Two", "None, if stopped", "The conductor only"], "1.11.1."], ["w1x", "GCOR 1.11.1 · Rule", "Before napping enroute, the employee in charge of locomotive controls must make at least what brake pipe reduction?", "10 lb.", ["5 lb.", "20 lb.", "No reduction is needed"], "1.11.1. Also place the generator field switch OFF and center the reverser (remove it if removable)."], ["w1x", "GCOR 1.11.1 · Scenario", "Your train is stopped waiting for a meet and the other crew member agrees to stay awake. What must happen first?", "Hold a job briefing to agree who will nap and who will stay awake", ["Nothing, just nap when practical", "Ask the dispatcher for a nap time when practical", "Remove the engine from the track whenever conditions allow"], "1.11.1: job briefing, 45-minute limit, one awake, and the train must not be delayed for a nap."], ["w1x", "GCOR 1.12 · Rule", "What is the maximum blade length of a knife allowed on duty or on railroad property?", "3 inches", ["4 inches", "6 inches", "No limit"], "1.12: no firearms or other deadly weapons, including knives with a blade longer than 3 inches. Railroad police may carry firearms in their work."], ["w1x", "GCOR 1.15 · Rule", "Employees must report for duty where and with what?", "At the designated time and place with the necessary equipment", ["At any time on the shift", "Without equipment if time allows", "Only when called twice if time allows"], "1.15."], ["w1x", "GCOR 1.15 · Rule", "May employees exchange duties or let others fill their assignment?", "Not without proper authority", ["Yes, with a co-worker’s agreement", "Yes, if both are qualified", "Yes, once per month"], "1.15."],
