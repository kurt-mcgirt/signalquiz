<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GCOR Signals Quiz</title>
<style>
:root{--bg:#f6f7f9;--fg:#15181d;--card:#fff;--mut:#5b6573;--ac:#1d4ed8;--ok:#15803d;--bad:#b91c1c;--bd:#d6dae0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--fg:#eef0f3;--card:#1b2027;--mut:#9aa4b2;--ac:#7aa2ff;--ok:#4ade80;--bad:#f87171;--bd:#2d3540}}
:root[data-theme="dark"]{--bg:#111418;--fg:#eef0f3;--card:#1b2027;--mut:#9aa4b2;--ac:#7aa2ff;--ok:#4ade80;--bad:#f87171;--bd:#2d3540}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
button,input{font:inherit;color:inherit}
button{min-height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--card);padding:10px 14px;text-align:left;width:100%;margin:6px 0;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;font-weight:600}
button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
button.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
input{width:100%;box-sizing:border-box;min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);padding:8px 12px}
.m{color:var(--mut);font-size:14px}.row{display:flex;justify-content:space-between;gap:8px}
.sg{display:flex;justify-content:center;margin:6px 0}
.bl{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:.12}}
@media(prefers-reduced-motion:reduce){.bl{animation:none}}
.big{font-size:44px;font-weight:700;text-align:center}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;font-size:15px}
.me{font-weight:700}
</style></head><body><main>
<h1>🚦 GCOR Signals Quiz</h1>
<div id="v"></div>
</main>
<script>
const C=[["Restricting","r,w",0,"9.1.13"],["Restricting","r,r",1,"9.1.13"],["Diverging Approach","r,y",0,"9.1.12"],["Diverging Approach Diverging","r,y,y",0,"9.1.10"],["Approach","y,r",1,"9.1.8"],["Approach Restricting","y,rf",null,"9.1.7"],["Approach Medium","y,y",1,"9.1.6"],["Advance Approach","y,g",1,"9.1.5"],["Clear","g,r,r",0,"9.1.3"],["Stop","d,r",0,"9.1.15"],["Stop","r",0,"9.1.15"],["Restricting","r,rf",0,"9.1.13"],["Restricting","rf",0,"9.1.13"],["Diverging Approach Medium","r,yf",0,"9.1.11"],["Diverging Clear","r,g",0,"9.1.9"],["Approach","y",0,"9.1.8"],["Approach Restricting","y,w",1,"9.1.7"],["Approach Medium","yf",1,"9.1.6"],["Approach Limited","y,gf",1,"9.1.4"],["Clear","g",0,"9.1.3"]];
const D={"Stop":"Stop.","Restricting":"Proceed at restricted speed.","Diverging Approach":"Proceed on diverging route not exceeding prescribed speed through turnout; approach next signal prepared to stop.","Diverging Approach Diverging":"Proceed on diverging route not exceeding prescribed speed through turnout prepared to advance on diverging route at the next signal not exceeding prescribed speed through turnout.","Approach":"Proceed prepared to stop at next signal. Trains exceeding 30 MPH immediately reduce to that speed.","Approach Restricting":"Proceed prepared to pass next signal at restricted speed. Freight trains exceeding 30 MPH immediately reduce to that speed.","Approach Medium":"Proceed prepared to pass next signal not exceeding 40 MPH and be prepared to enter diverging route at prescribed speed.","Advance Approach":"Proceed prepared to pass next signal not exceeding 50 MPH and be prepared to enter diverging route at prescribed speed.","Approach Limited":"Proceed prepared to pass next signal not exceeding 60 MPH and be prepared to enter diverging route at prescribed speed.","Clear":"Proceed.","Diverging Approach Medium":"Proceed on diverging route not exceeding prescribed speed through turnout prepared to pass next signal not exceeding 35 MPH.","Diverging Clear":"Proceed on diverging route not exceeding prescribed speed through turnout."};
const SC=[["A signal ahead is dark and no semaphore arm is visible. How do you treat it?","As Stop, its most restrictive indication, and report it to the train dispatcher (GCOR 9.4)",["As Clear, since nothing is displayed","As Approach and continue at 30 MPH","Proceed at restricted speed and report it at the next stop"]],
["Your freight train is doing 45 MPH and the signal shows Approach Restricting. What now?","Immediately reduce to 30 MPH and be prepared to pass the next signal at restricted speed",["Maintain 45 MPH to the next signal","Stop at once","Reduce to 40 MPH and proceed normally"]],
["Your passenger train is doing 55 MPH and the signal shows Approach. What now?","Reduce to 40 MPH and be prepared to stop at the next signal",["Reduce to 30 MPH and pass the next signal at restricted speed","Maintain speed to the next signal","Reduce to 35 MPH and expect Clear"]],
["Which signal says to pass the next signal not exceeding 50 MPH and be prepared to enter the diverging route?","Advance Approach",["Approach Medium","Approach Limited","Clear"]],
["Approach Limited: what is the maximum speed past the next signal?","60 MPH",["40 MPH","50 MPH","35 MPH"]],
["Approach Medium: what is the maximum speed past the next signal?","40 MPH",["30 MPH","50 MPH","60 MPH"]],
["Diverging Approach Medium: how fast may you pass the next signal?","Not exceeding 35 MPH (40 MPH in PTC Full Enforcement Mode)",["40 MPH for everyone","30 MPH","50 MPH"]],
["You get a Restricting indication. How do you proceed?","At restricted speed",["Prepared to stop at 30 MPH only","At prescribed speed through the turnout","Not exceeding 40 MPH"]],
["You get Diverging Clear. How do you proceed?","On the diverging route, not exceeding prescribed speed through the turnout",["Straight route at track speed","Prepared to stop at the next signal","At restricted speed on the main track"]]];
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
const col={r:"#e53935",y:"#fdd835",g:"#43a047",w:"#f1f1f1"},cn={r:"Red",y:"Yellow",g:"Green",w:"Lunar white"};
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},ss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function sig(l,p){const h=44,n=l.split(",").length,H=n*h+(p?18:0)+80;let s=`<svg viewBox="0 0 70 ${H}" width="84" role="img" aria-label="Signal"><rect x="33" y="10" width="4" height="${H-24}" fill="#777"/>`;
l.split(",").forEach((x,i)=>{const c=x[0],f=x[1]==="f",y=4+i*h;s+=`<rect x="14" y="${y}" width="42" height="40" rx="10" fill="#14181d" stroke="#555"/>`;if(c!=="d")s+=`<circle cx="35" cy="${y+20}" r="9" fill="${col[c]}" class="${f?"bl":""}"/>`;if(f)s+=`<circle cx="35" cy="${y+20}" r="14" fill="none" stroke="${col[c]}" stroke-dasharray="3 4" class="bl"/>`});
if(p)s+=`<rect x="22" y="${n*h+12}" width="26" height="9" fill="#fff" stroke="#999"/>`;return s+`<path d="M24 ${H-14}h22l4 14h-30z" fill="#555"/></svg>`}
const names=[...new Set(C.map(c=>c[0]))],Q={};
const dis=(a,n,ex)=>sh(a.filter(x=>x!==ex)).slice(0,n);
C.forEach((c,i)=>{Q["i"+i]={r:"i",t:"What is this signal indication?",s:c,a:c[0],o:dis(names,3,c[0]),n:c[3]+": "+D[c[0]]};});
names.forEach(n=>Q["d"+n]={r:"d",t:"“"+n+"” means:",a:D[n],o:dis(Object.values(D),3,D[n]),n:"Rule: "+C.find(c=>c[0]===n)[3]});
SC.forEach((s,i)=>Q["s"+i]={r:"s",t:s[0],a:s[1],o:s[2],n:""});
const R=[["i","Signal indications"],["d","Signal definitions"],["s","Conductor scenarios"]];
let best=ls("sq_best",{}),missed=ls("sq_miss",[]),name=ls("sq_name",""),st;
function home(){const v=$("#v");v.innerHTML=`<div class="card"><label class="m" for="un">Your name (used when you copy your results)</label><input id="un" maxlength="16" value="" placeholder="e.g. Conductor42"></div><p class="m">Pass mark is 90%. Practice both open and closed book: try each round without the cards first.</p>`;
$("#un").value=name;$("#un").oninput=e=>{name=e.target.value.trim();ss("sq_name",name)};
R.forEach(([k,t])=>{const b=document.createElement("button");b.innerHTML=`<div class="row"><b>${t}</b><span>${best[k]!=null?best[k]+"%":"–"}</span></div><span class="m">${Object.keys(Q).filter(x=>Q[x].r===k).length} questions</span>`;b.onclick=()=>start(k);v.append(b)});
const m=document.createElement("button");m.className="p";m.textContent="Missed questions ("+missed.filter(x=>Q[x]).length+")";m.onclick=()=>start("m");v.append(m);const cp=document.createElement("button");cp.textContent="Copy my results";cp.onclick=copyRes;v.append(cp)}
function start(k){let ids=k==="m"?missed.filter(x=>Q[x]):Object.keys(Q).filter(x=>Q[x].r===k);if(!ids.length){alert("Nothing missed yet. Play a round first.");return}
st={k,ids:sh(ids),i:0,ok:0,bad:[],good:[]};show()}
function show(){const id=st.ids[st.i],q=Q[id],v=$("#v");let o=q.yn?[q.a,...q.o].sort():sh([q.a,...q.o]);
v.innerHTML=`<div class="m">Question ${st.i+1} of ${st.ids.length}</div><div class="card"><b>${q.t}</b>${q.s?`<div class="sg">${sig(q.s[1],q.s[2])}</div>`:""}</div><div id="ops"></div><div id="fb"></div>`;
o.forEach(x=>{const b=document.createElement("button");b.textContent=x;b.onclick=()=>ans(id,x,b);$("#ops").append(b)})}
function ans(id,x,b){const q=Q[id],r=x===q.a;[...$("#ops").children].forEach(c=>{c.disabled=true;if(c.textContent===q.a)c.classList.add("ok")});if(!r)b.classList.add("no");
(r?(st.ok++,st.good):st.bad).push(id);const n=document.createElement("button");n.className="p";n.textContent=st.i+1<st.ids.length?"Next":"See score";n.onclick=()=>{st.i++;st.i<st.ids.length?show():fin()};
$("#fb").innerHTML=`<div class="card"><b>${r?"Correct":"Not quite"}</b><div class="m">${r?"":"Answer: "+q.a+". "}${q.n}</div></div>`;$("#fb").append(n)}
function fin(){const n=st.ids.length,p=Math.round(st.ok/n*100);missed=[...new Set([...missed.filter(x=>!st.good.includes(x)),...st.bad])];ss("sq_miss",missed);
if(st.k!=="m"&&p>(best[st.k]??-1)){best[st.k]=p;ss("sq_best",best)}
$("#v").innerHTML=`<div class="card"><div class="big" style="color:var(--${p>=90?"ok":"bad"})">${p}%</div><p style="text-align:center">${st.ok} of ${n} correct. ${p>=90?"That clears the 90% pass mark.":"The pass mark is 90%. Run the missed round and try again."}</p></div>`;
const h=document.createElement("button");h.className="p";h.textContent="Back to rounds";h.onclick=home;$("#v").append(h);const cp=document.createElement("button");cp.textContent="Copy my results";cp.onclick=copyRes;$("#v").append(cp)}
function copyRes(){const t=(name||"Student")+": "+R.map(([k,l])=>l+" "+(best[k]!=null?best[k]+"%":"–")).join(", ")+" (best scores, pass mark 90%)";try{navigator.clipboard.writeText(t).then(()=>alert("Copied. Paste it in your class chat."),()=>prompt("Copy this:",t))}catch(e){prompt("Copy this:",t)}}
home();
</script></body></html>
