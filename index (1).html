<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GCOR Signals Quiz</title>
<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--fg:#eef0f3;--card:#1b2027;--mut:#9aa4b2;--ac:#7aa2ff;--ok:#4ade80;--bad:#f87171;--bd:#2d3540}}
:root[data-theme="dark"]{--bg:#111418;--fg:#eef0f3;--card:#1b2027;--mut:#9aa4b2;--ac:#7aa2ff;--ok:#4ade80;--bad:#f87171;--bd:#2d3540}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
button,input{font:inherit;color:inherit}
button{min-height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--card);padding:10px 14px;text-align:left;width:100%;margin:6px 0;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;font-weight:600}
button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}

input{width:100%;box-sizing:border-box;min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);padding:8px 12px}
.m{color:var(--mut);font-size:14px}.row{display:flex;justify-content:space-between;gap:8px}
.sg{display:flex;justify-content:center;margin:6px 0}
.bl{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:.12}}
@media(prefers-reduced-motion:reduce){.bl{animation:none}}
.big{font-size:44px;font-weight:700;text-align:center}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;font-size:15px}
.me{font-weight:700}
</style></head><body><main>
<h1>🚦 GCOR Signals Quiz</h1>
<div id="v"></div>
</main>
<script>
const C=[["Restricting","r,w",0,"9.1.13"],["Restricting","r,r",1,"9.1.13"],["Diverging Approach","r,y",0,"9.1.12"],["Diverging Approach Diverging","r,y,y",0,"9.1.10"],["Approach","y,r",1,"9.1.8"],["Approach Restricting","y,rf",null,"9.1.7"],["Approach Medium","y,y",1,"9.1.6"],["Advance Approach","y,g",1,"9.1.5"],["Clear","g,r,r",0,"9.1.3"],["Stop","d,r",0,"9.1.15"],["Stop","r",0,"9.1.15"],["Restricting","r,rf",0,"9.1.13"],["Restricting","rf",0,"9.1.13"],["Diverging Approach Medium","r,yf",0,"9.1.11"],["Diverging Clear","r,g",0,"9.1.9"],["Approach","y",0,"9.1.8"],["Approach Restricting","y,w",1,"9.1.7"],["Approach Medium","yf",1,"9.1.6"],["Approach Limited","y,gf",1,"9.1.4"],["Clear","g",0,"9.1.3"]];
const D={"Stop":"Stop.","Restricting":"Proceed at restricted speed.","Diverging Approach":"Proceed on diverging route not exceeding prescribed speed through turnout; approach next signal prepared to stop.","Diverging Approach Diverging":"Proceed on diverging route not exceeding prescribed speed through turnout prepared to advance on diverging route at the next signal not exceeding prescribed speed through turnout.","Approach":"Proceed prepared to stop at next signal. Trains exceeding 30 MPH immediately reduce to that speed.","Approach Restricting":"Proceed prepared to pass next signal at restricted speed. Freight trains exceeding 30 MPH immediately reduce to that speed.","Approach Medium":"Proceed prepared to pass next signal not exceeding 40 MPH and be prepared to enter diverging route at prescribed speed.","Advance Approach":"Proceed prepared to pass next signal not exceeding 50 MPH and be prepared to enter diverging route at prescribed speed.","Approach Limited":"Proceed prepared to pass next signal not exceeding 60 MPH and be prepared to enter diverging route at prescribed speed.","Clear":"Proceed.","Diverging Approach Medium":"Proceed on diverging route not exceeding prescribed speed through turnout prepared to pass next signal not exceeding 35 MPH.","Diverging Clear":"Proceed on diverging route not exceeding prescribed speed through turnout."};
const SC=[["A signal ahead is dark and no semaphore arm is visible. How do you treat it?","As Stop, its most restrictive indication, and report it to the train dispatcher (GCOR 9.4)",["As Clear, since nothing is displayed","As Approach and continue at 30 MPH","Proceed at restricted speed and report it at the next stop"]],
["Your freight train is doing 45 MPH and the signal shows Approach Restricting. What now?","Immediately reduce to 30 MPH and be prepared to pass the next signal at restricted speed",["Maintain 45 MPH to the next signal","Stop at once","Reduce to 40 MPH and proceed normally"]],
["Your passenger train is doing 55 MPH and the signal shows Approach. What now?","Reduce to 40 MPH and be prepared to stop at the next signal",["Reduce to 30 MPH and pass the next signal at restricted speed","Maintain speed to the next signal","Reduce to 35 MPH and expect Clear"]],
["Which signal says to pass the next signal not exceeding 50 MPH and be prepared to enter the diverging route?","Advance Approach",["Approach Medium","Approach Limited","Clear"]],
["Approach Limited: what is the maximum speed past the next signal?","60 MPH",["40 MPH","50 MPH","35 MPH"]],
["Approach Medium: what is the maximum speed past the next signal?","40 MPH",["30 MPH","50 MPH","60 MPH"]],
["Diverging Approach Medium: how fast may you pass the next signal?","Not exceeding 35 MPH (40 MPH in PTC Full Enforcement Mode)",["40 MPH for everyone","30 MPH","50 MPH"]],
["You get a Restricting indication. How do you proceed?","At restricted speed",["Prepared to stop at 30 MPH only","At prescribed speed through the turnout","Not exceeding 40 MPH"]],
["You get Diverging Clear. How do you proceed?","On the diverging route, not exceeding prescribed speed through the turnout",["Straight route at track speed","Prepared to stop at the next signal","At restricted speed on the main track"]]];
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
const col={r:"#e53935",y:"#fdd835",g:"#43a047",w:"#f1f1f1"},cn={r:"Red",y:"Yellow",g:"Green",w:"Lunar white"};
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},ss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function sig(l,p){const h=44,n=l.split(",").length,H=n*h+(p?18:0)+80;let s=`<svg viewBox="0 0 70 ${H}" width="84" role="img" aria-label="Signal"><rect x="33" y="10" width="4" height="${H-24}" fill="#777"/>`;
l.split(",").forEach((x,i)=>{const c=x[0],f=x[1]==="f",y=4+i*h;s+=`<rect x="14" y="${y}" width="42" height="40" rx="10" fill="#14181d" stroke="#555"/>`;if(c!=="d")s+=`<circle cx="35" cy="${y+20}" r="9" fill="${col[c]}" class="${f?"bl":""}"/>`;if(f)s+=`<circle cx="35" cy="${y+20}" r="14" fill="none" stroke="${col[c]}" stroke-dasharray="3 4" class="bl"/>`});
if(p)s+=`<rect x="22" y="${n*h+12}" width="26" height="9" fill="#fff" stroke="#999"/>`;return s+`<path d="M24 ${H-14}h22l4 14h-30z" fill="#555"/></svg>`}
const names=[...new Set(C.map(c=>c[0]))],Q={};
const dis=(a,n,ex)=>sh(a.filter(x=>x!==ex)).slice(0,n);
C.forEach((c,i)=>{Q["i"+i]={r:"i",t:"What is this signal indication?",s:c,a:c[0],o:dis(names,3,c[0]),n:c[3]+": "+D[c[0]]};});
names.forEach(n=>Q["d"+n]={r:"d",t:"“"+n+"” means:",a:D[n],o:dis(Object.values(D),3,D[n]),n:"Rule: "+C.find(c=>c[0]===n)[3]});
SC.forEach((s,i)=>Q["s"+i]={r:"s",t:s[0],a:s[1],o:s[2],n:""});
const W=[
['g','GCOR 5.4.1','Which flag marks a temporary speed restriction?','Yellow',['Yellow-red','Green','Red'],'5.4.1: yellow flags are used for temporary speed restrictions. Yellow-red flags are used when a train may be required to stop.'],
['g','GCOR 5.4.2','How far ahead of the restricted area is a yellow flag displayed?','2 miles before the restricted area',['1 mile before the restricted area','4 miles before the restricted area','At the start of the restriction only'],'5.4.2: the flag goes 2 miles before the restriction. The wording I found also allows less than 2 miles near a terminal or junction, so confirm in your current book.'],
['g','GCOR 5.4.2','What does a yellow flag warn trains to do?','Restrict movement because of track conditions or structures',['Be prepared to stop for men or equipment','Stop at the flag','Resume normal speed'],'5.4.2: yellow warns of a restriction. Being prepared to stop for men or equipment is the yellow-red flag.'],
['g','GCOR 5.4.3','What does a yellow-red flag warn a train to do?','Be prepared to stop because of men or equipment',['Reduce speed for track conditions','Resume track speed','Stop at the flag'],'5.4.3: yellow-red is for men or equipment. Plain yellow is for track conditions or structures.'],
['g','GCOR 5.4.3','A yellow-red flag is displayed and no bulletin, warrant, or general order specifies a restriction. Where must you be prepared to stop?','Short of a red flag 2 miles beyond the yellow-red flag',['At the yellow-red flag itself','Short of a red flag 1 mile beyond it','Short of a red flag 4 miles beyond it'],'5.4.3: be prepared to stop short of a red flag 2 miles beyond the yellow-red flag, and try to contact the employee in charge.'],
['g','GCOR 5.4.3','No red flag is seen and the employee in charge has given no instructions. How do you proceed?','At restricted speed, increasing speed only after instructions, or 4 miles beyond the flag once the dispatcher verifies no bulletin or warrant protecting men or equipment',['At the speed shown on the flag','At 30 MPH until the next signal','At track speed once past the flag'],'5.4.3: move at restricted speed. Speed may increase only after instructions from the employee in charge, or 4 miles past the flag once the dispatcher verifies nothing protecting men or equipment is in effect.'],
['g','GCOR 5.4.5','What does a green flag indicate?','The end of a restricted area',['The start of a temporary speed restriction','Proceed at restricted speed','A track bulletin is in effect'],'5.4.5: green marks the end of the restriction.'],
['g','GCOR 5.4.5','Several restricted areas run back to back. How are flags placed?','A yellow or yellow-red flag for each restricted area, and a green flag only at the end of the last one',['A green flag at the end of every restricted area','One yellow flag at the start and a green flag after each area','One yellow and one green flag with no flag between areas'],'5.4.5: a yellow or yellow-red flag for each restricted area, and a green flag only at the end of the last.'],
['g','GCOR 5.4.7','A red flag is specified by a track bulletin, warrant, or general order. What must the train do?','Stop short of the flag and not proceed unless the employee in charge gives instructions, including the flag’s milepost',['Pass at restricted speed','Proceed once the dispatcher is told','Stop only if the flag is between the rails'],'5.4.7 A (9th ed.): stop short and wait for instructions from the employee in charge.'],
['g','GCOR 5.4.7','A red flag is displayed and no bulletin, warrant, or general order specifies it. What must the train do?','Stop immediately, consistent with good train handling, and try to contact the employee in charge',['Pass at restricted speed','Continue to the next green flag','Stop only if the flag is between the rails'],'5.4.7 B (9th ed.): stop immediately, then try to reach the employee in charge with the flag location and track.'],
['g','GCOR 5.4.7','The employee in charge permits a train to pass a red flag with no restriction in effect. What must the instructions include?','Speed and distance',['Time and engine number','Milepost and track name only','The dispatcher’s authority number'],'5.4.7 B: instructions must include speed and distance, and that speed holds until the rear of the train passes the distance.'],
['g','GCOR 5.4.7','A red flag is displayed between the rails. When may the train proceed?','Only after the flag is removed by an employee of the class that placed it',['After calling the dispatcher','At restricted speed after stopping','After the conductor walks the track'],'5.4.7 C (9th ed.): stop and stay stopped until the flag is removed by the class that placed it.'],
['g','GCOR 5.4.8','Where are yellow and green flags normally displayed?','To the right of the track as viewed from an approaching train',['To the left of the track as viewed from an approaching train','Between the rails','On whichever side the crew chooses'],'5.4.8: right side, unless a bulletin, warrant, special instruction, or general order says otherwise.'],
['g','GCOR 5.4.8','Which flag may be displayed between the rails?','Red',['Yellow','Green','Yellow-red'],'5.4.8: red flags or lights may be between the rails.'],
['g','GCOR 5.5','What do the numbers on a permanent speed sign show?','The highest speed permitted over the limits of the restriction',['The speed to resume after the restriction','The distance in miles to the restriction','The speed for passenger trains only'],'5.5: the numbers show the highest permitted speed over the restriction.'],
['g','GCOR 5.5','A permanent speed sign shows two sets of numbers. Which governs?','The greater number for all-passenger trains, the lesser for all other trains',['The greater number for all trains','The lesser number for all-passenger trains only','The greater number for freight trains'],'5.5: the greater number is for trains consisting entirely of passenger equipment, the lesser for all others.'],
['g','GCOR 5.5','When may a train exceed the speed on a permanent speed sign again?','After the rear of the train passes a resume speed sign or a higher speed sign, or clears the limits',['After the engine passes the resume sign','After the engine clears the limits','After 2 miles'],'5.5: the rear of the train must clear, not the head end.'],
['g','GCOR 15.2','What is the purpose of a Track Bulletin Form B?','To protect men or equipment on or near the track',['To list temporary speed restrictions','To authorize a train to occupy the main track','To announce a permanent speed restriction'],'15.2: Form B protects men and equipment. Temporary speed restrictions are a Form A item. Confirm the exact wording in your book.'],
['g','GCOR Glossary','When is a person fouling a track?','When close enough to be struck by a moving train or equipment, or within four feet of the nearest rail',['Only when between the rails','Only when within 10 feet of the rail','Only when standing on the ties'],'Glossary (9th ed.): individual fouling a track. This is the GCOR definition, not the TYE S-1.6.2 wording, which I could not find.'],
['h','GCOR 5.4.7 A','Your train approaches a bulletin-specified red flag and the foreman hasn’t answered. What do you do?','Stop short of the flag, try to reach the employee in charge with the flag location and your track, and do not proceed without instructions',['Pass the flag at restricted speed','Notify the dispatcher and proceed','Wait 15 minutes, then proceed'],'5.4.7 A.'],
['h','GCOR 5.4.7 A','You are slowing for a bulletin red flag when the employee in charge gives you instructions, including the flag’s milepost. May you pass without stopping?','Yes, if the instructions are received before the train stops',['No, a full stop is always required','Only with the dispatcher’s approval','Only at 5 MPH'],'5.4.7 A: instructions received before stopping allow passing without stopping.'],
['h','GCOR 5.4.7 B','You stopped at a red flag with no restriction in effect and cannot reach the employee in charge. What must you do?','Notify the train dispatcher or control operator of the delay',['Proceed at restricted speed','Remove the flag and proceed','Wait 15 minutes, then proceed'],'5.4.7 B: the rule says to notify the dispatcher or control operator. It does not allow proceeding on your own.'],
['h','GCOR 5.4.7 B','The employee in charge lets you pass a red flag at 10 MPH for 1 mile. When may you speed up?','Not until the rear of the train is 1 mile past the flag, unless the employee in charge says otherwise',['As soon as the engine passes the flag','After the engine is 1 mile past','After calling the dispatcher'],'5.4.7 B: the speed holds until the rear passes the specified distance.'],
['h','GCOR 5.4.7 C','A red flag hangs between the rails and no workers are in sight. What do you do?','Stay stopped until the flag is removed by an employee of the class that placed it',['Remove the flag yourself and proceed','Proceed at restricted speed','Proceed after notifying the dispatcher'],'5.4.7 C.'],
['h','GCOR 5.4.3','You pass a yellow-red flag and no bulletin, warrant, or general order specifies a restriction. What must you do?','Try to contact the employee in charge and be prepared to stop short of a red flag 2 miles beyond',['Resume track speed after the flag','Stop at the flag','Reduce to 30 MPH and ignore it'],'5.4.3.'],
['h','GCOR 5.4.3','You passed a yellow-red flag, saw no red flag in 2 miles, and have no instructions. What speed rule applies?','Restricted speed until instructed, or until 4 miles beyond with dispatcher verification that nothing protecting men or equipment is in effect',['Track speed after 2 miles','Half track speed until a green flag','30 MPH until the next signal'],'5.4.3.'],
['h','GCOR 5.4.2','You are 4 miles past a yellow flag with no written restriction known. May you increase speed?','Only after the dispatcher verifies no bulletin or warrant specifies a temporary restriction there, or you get permission from the employee in charge, or the rear passes a green flag',['Yes, 4 miles always clears it','Only after the engine passes a green flag','No, not until the next signal'],'5.4.2 (earlier-edition wording I found; confirm in your current book).'],
['h','GCOR 5.4.8','Where do you look for a yellow flag?','To the right of the track as viewed from the approaching train, unless a bulletin, warrant, special instruction, or general order says otherwise',['Between the rails','To the left of the track','On the engineer’s side of the train'],'5.4.8.'],
['h','GCOR 5.5','Your freight train sees a permanent speed sign with two sets of numbers, 60 and 45. What is your limit?','45 MPH',['60 MPH','50 MPH','Whichever the engineer chooses'],'5.5: the lesser number governs trains that are not entirely passenger equipment.'],
['h','GCOR 5.5','Your engine just passed a permanent resume speed sign. May the whole train speed up?','No, not until the rear of the train passes the sign or clears the restriction limits',['Yes, the engine passing is enough','Yes, after 1 mile','Only with dispatcher permission'],'5.5.'],
['h','GCOR 5.4.7 and 15.2','Your Form B limits are marked by a red flag and the foreman is not answering. What do you do?','Stop short of the limits, stay there until the employee in charge authorizes you, and notify the dispatcher of the delay',['Enter at restricted speed','Enter after 15 minutes','Enter if the dispatcher says the bulletin is active'],'5.4.7 and 15.2: a Form B red flag means stop until the employee in charge permits movement.'],
['h','GCOR Glossary','A coworker stands 3 feet from the nearest rail of an adjacent track as equipment moves. Is he fouling the track?','Yes, within four feet of the nearest rail counts',['No, only between the rails counts','No, only within 2 feet counts','Only if equipment is moving toward him'],'Glossary (9th ed.): fouling includes being within four feet of the nearest rail.']
];
W.forEach((w,i)=>{Q['w'+i]={r:w[0],u:w[1],t:w[2],a:w[3],o:w[4],n:w[5]}});
const R=[['i','Signal indications'],['d','Signal definitions'],['s','Conductor scenarios'],['g','Rules and definitions (GCOR Week 2)'],['h','Rule scenarios (GCOR Week 2)']];
let best=ls("sq_best",{}),missed=ls("sq_miss",[]),name=ls("sq_name",""),st;
function home(){const v=$("#v");v.innerHTML=`<div class="card"><label class="m" for="un">Your name (used when you copy your results)</label><input id="un" maxlength="16" value="" placeholder="e.g. Conductor42"></div><p class="m">Pass mark is 90%. Practice both open and closed book: try each round without the cards first.</p><div class="card m"><b>Draft rule rounds.</b> The two Week 2 rounds use the GCOR text I could find (9th edition changes plus earlier-edition wording). Check every answer against your current rulebook. Still needs source text: GCOR 1.47 and 4.3; SSI 1, 5, 11, 13, 14, 33, 48; ABTH 102.x and 104.14; TYE SR S-1.6.2 and S-13.x.</div>`;
$("#un").value=name;$("#un").oninput=e=>{name=e.target.value.trim();ss("sq_name",name)};
R.forEach(([k,t])=>{const b=document.createElement("button");b.innerHTML=`<div class="row"><b>${t}</b><span>${best[k]!=null?best[k]+"%":"–"}</span></div><span class="m">${Object.keys(Q).filter(x=>Q[x].r===k).length} questions</span>`;b.onclick=()=>start(k);v.append(b)});
const m=document.createElement("button");m.className="p";m.textContent="Missed questions ("+missed.filter(x=>Q[x]).length+")";m.onclick=()=>start("m");v.append(m);const cp=document.createElement("button");cp.textContent="Copy my results";cp.onclick=copyRes;v.append(cp)}
function start(k){let ids=k==="m"?missed.filter(x=>Q[x]):Object.keys(Q).filter(x=>Q[x].r===k);if(!ids.length){alert("Nothing missed yet. Play a round first.");return}
st={k,ids:sh(ids),i:0,ok:0,bad:[],good:[]};show()}
function show(){const id=st.ids[st.i],q=Q[id],v=$("#v");let o=q.yn?[q.a,...q.o].sort():sh([q.a,...q.o]);
v.innerHTML=`<div class="m">Question ${st.i+1} of ${st.ids.length}${q.u?" · "+q.u:""}</div><div class="card"><b>${q.t}</b>${q.s?`<div class="sg">${sig(q.s[1],q.s[2])}</div>`:""}</div><div id="ops"></div><div id="fb"></div>`;
o.forEach(x=>{const b=document.createElement("button");b.textContent=x;b.onclick=()=>ans(id,x,b);$("#ops").append(b)})}
function ans(id,x,b){const q=Q[id],r=x===q.a;[...$("#ops").children].forEach(c=>{c.disabled=true;if(c.textContent===q.a)c.classList.add("ok")});if(!r)b.classList.add("no");
(r?(st.ok++,st.good):st.bad).push(id);const n=document.createElement("button");n.className="p";n.textContent=st.i+1<st.ids.length?"Next":"See score";n.onclick=()=>{st.i++;st.i<st.ids.length?show():fin()};
$("#fb").innerHTML=`<div class="card"><b>${r?"Correct":"Not quite"}</b><div class="m">${r?"":"Answer: "+q.a+". "}${q.n}</div></div>`;$("#fb").append(n)}
function fin(){const n=st.ids.length,p=Math.round(st.ok/n*100);missed=[...new Set([...missed.filter(x=>!st.good.includes(x)),...st.bad])];ss("sq_miss",missed);
if(st.k!=="m"&&p>(best[st.k]??-1)){best[st.k]=p;ss("sq_best",best)}
$("#v").innerHTML=`<div class="card"><div class="big" style="color:var(--${p>=90?"ok":"bad"})">${p}%</div><p style="text-align:center">${st.ok} of ${n} correct. ${p>=90?"That clears the 90% pass mark.":"The pass mark is 90%. Run the missed round and try again."}</p></div>`;
const h=document.createElement("button");h.className="p";h.textContent="Back to rounds";h.onclick=home;$("#v").append(h);const cp=document.createElement("button");cp.textContent="Copy my results";cp.onclick=copyRes;$("#v").append(cp)}
function copyRes(){const t=(name||"Student")+": "+R.map(([k,l])=>l+" "+(best[k]!=null?best[k]+"%":"–")).join(", ")+" (best scores, pass mark 90%)";try{navigator.clipboard.writeText(t).then(()=>alert("Copied. Paste it in your class chat."),()=>prompt("Copy this:",t))}catch(e){prompt("Copy this:",t)}}
home();
</script></body></html>
